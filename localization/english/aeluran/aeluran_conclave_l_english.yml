l_english:
    # Succession law on the Seat of the High Matriarch
    aeluran_conclave_succession_law:0 "Council of Matrons"
    aeluran_conclave_succession_law_subname:0 "Council of Matrons"
    aeluran_conclave_succession_law_effects:0 "\nThe [council_of_matrons|E] elects the next High Matriarch from among its own number. Every Matron who holds a [matron_seat|E] is both an [elector|E] and a candidate.\n\nOnly the Seat of the High Matriarch and Spirits' Landing pass to the new High Matriarch. The late Matriarch's other lands pass to her family, and the elected Matron keeps the lands she already rules."
    aeluran_matron_conclave_candidates:0 "Matrons"
    aeluran_matron_conclave_candidates_tooltip:0 "In order to be a valid Candidate under $aeluran_conclave_succession_law$, a character must be a Matron of the Aeluran Order holding a [matron_seat|E]."
    aeluran_matron_conclave_electors:0 "The Council of Matrons"
    aeluran_matron_conclave_electors_tooltip:0 "In order to be a valid [elector|E] under $aeluran_conclave_succession_law$, a character must be a Matron of the Aeluran Order holding a [matron_seat|E]."
    CANT_CHANGE_AELURAN_CONCLAVE_LAW_TOOLTIP:0 "The [succession_laws|E] of the High Matriarch cannot be changed: the [council_of_matrons|E] always elects her successor"

    # The Council of Matrons window (gui/window_cardinals.gui for the Aeluran faiths)
    AELURAN_COLLEGE_VIEW_TITLE:0 "Council of Matrons"
    AELURAN_COLLEGE_VIEW_MATRIARCH:0 "High Matriarch: [Character.GetShortUINameNotMeNoTooltip]"
    AELURAN_COLLEGE_VIEW_INTERACTIONS_BUTTON_TT:0 "#T Show Matron Interactions#!"
    AELURAN_COLLEGE_VIEW_WILL_VOTE_FOR:0 "Matrons voting for [Character.GetShortUINameNoTooltip|U] to take the Seat"
    AELURAN_COLLEGE_VIEW_CANDIDACY_SCORES:0 "[matron_candidacy|E]"
    AELURAN_COLLEGE_VIEW_CANDIDACY_SCORE:0 "[matron_candidacy|E]"
    AELURAN_FAITH_VIEW_COUNCIL_OF_MATRONS:0 "#T [council_of_matrons|E]#!\n\n#I Click to view#!"

    # Game concepts
    game_concept_council_of_matrons:0 "Council of Matrons"
    game_concept_council_of_matrons_desc:0 "The Council of Matrons is the leadership council of the Aeluran Order, and it chooses the High Matriarch.\n\nEvery Matron holds a [matron_seat|E] on the Council. When the High Matriarch dies, the Matrons elect her successor from among themselves: each Matron is both an [elector|E] and a candidate. At any time three Matrons stand as candidates, the strongest in each [matron_candidacy|E].\n\nThe new High Matriarch takes the Seat of the High Matriarch and Spirits' Landing, home of the Deep Wood Sanctum. She keeps the lands she already rules, and the late Matriarch's own lands pass to her family.\n\nA High Matriarch's death does not end your game: you continue as her heir, and may choose to guide the Order as the new High Matriarch instead. With no landed heir, you continue as the new High Matriarch."
    game_concept_matron_seat:0 "Matron's Seat"
    game_concept_matron_seats:0 "Matron's Seats"
    game_concept_matron_candidacy:0 "Candidacy"
    game_concept_matron_candidacies:0 "Candidacies"
    game_concept_matron_candidacy_desc:0 "How strongly a Matron could stand before the [council_of_matrons|E] as each kind of candidate:\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_spark_touched$#!: Elven ascension, magical talent and learning\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_red_born$#!: born to a Matriarch, royal Elven blood and piety\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_worldly$#!: realm, prestige and diplomacy\n\nThe Matron with the highest score in each stands for election."

    # Candidate archetypes
    aeluran_conclave_spark_touched:0 "The Spark-Touched"
    aeluran_conclave_spark_touched_desc:0 "#flavor The Council puts forward the sister in whom the Divine Spark burns brightest.#!\n\nTo become #EMP $aeluran_conclave_spark_touched$#!, a Matron must be the most gifted in the Spark: the most ascended of Elves, the greatest magical talent, and the keenest learning."
    aeluran_conclave_red_born:0 "The Red-Born"
    aeluran_conclave_red_born_desc:0 "#flavor The mantle of The Red has passed from mother to daughter before, and some would see it do so again.#!\n\nTo become #EMP $aeluran_conclave_red_born$#!, a Matron must come of the Matriarchs' own line: born to a Matriarch, of royal Elven blood, and deep in piety."
    aeluran_conclave_worldly:0 "The Worldly"
    aeluran_conclave_worldly_desc:0 "#flavor The Order has enemies as well as followers, so the Council puts forward a Matron with the means to hold the Seat.#!\n\nTo become #EMP $aeluran_conclave_worldly$#!, a Matron must command the most temporal power: the greatest realm, the most prestige, and a diplomat's tongue."

    # Voting reasons
    aeluran_conclave_vote_myself:0 "Believes she is the Matron the Order needs"
    aeluran_conclave_vote_myself_ambitious:0 "Covets the Seat for herself"
    aeluran_conclave_vote_not_myself:0 "Does not seek the Seat"
    aeluran_conclave_vote_same_rite:0 "A sister of her own rite"
    aeluran_conclave_vote_other_rite:0 "Follows a different rite"
    aeluran_conclave_vote_matriarch_choice:0 "The High Matriarch's chosen successor"

    # Matron's Seat titles and the Matron style
    aeluran_matron_seat_duchy:0 "Matron's Seat"
    aeluran_matron_female:0 "Matron"
    aeluran_matron_seat_name_county:0 "[matron_seat_county.GetNameNoTierNoTooltip]"
    aeluran_matron_seat_adj_county:0 "[matron_seat_county.GetBaseNameNoTooltip]"
    aeluran_matron_seat_name_person:0 "[matron_seat_recipient.GetFirstNameNoTooltip]"
    aeluran_matron_seat_adj_person:0 "[matron_seat_recipient.GetFirstNameNoTooltip]"

    # The Seat passes (the player who played the late High Matriarch)
    aeluran_repeating.008.title:0 "The Seat Passes"
    aeluran_repeating.008.desc:0 "[dead_aeluran.GetName] has returned to the Divine Spark, and the Council of Matrons has raised [new_matriarch.GetName] to the Seat of the High Matriarch.\n\n"
    aeluran_repeating.008.desc_lands:0 "Her own lands have passed to you. "
    aeluran_repeating.008.desc_choice:0 "You may carry on her line, or take up the mantle of The Red and guide the Aeluran Order as its new High Matriarch."
    aeluran_repeating.008.a:0 "I will carry on her line."
    aeluran_repeating.008.b:0 "I will guide the Order as [new_matriarch.GetFirstName]."

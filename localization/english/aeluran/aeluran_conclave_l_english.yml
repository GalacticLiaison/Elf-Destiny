l_english:
    # Succession law on the Seat of the High Matriarch
    aeluran_conclave_succession_law:0 "Council of Matrons"
    aeluran_conclave_succession_law_subname:0 "Council of Matrons"
    aeluran_conclave_succession_law_effects:0 "\nThe [council_of_matrons|E] elects the next High Matriarch from among its own number. Every Matron who holds a [matron_seat|E] is both an [elector|E] and a candidate. The sitting High Matriarch casts a vote as well, and Matrons loyal to her tend to follow her choice.\n\nOnly the Seat of the High Matriarch and Spirits' Landing pass to the new High Matriarch. The late Matriarch's other lands pass to her family, and the elected Matron keeps the lands she already rules."
    aeluran_matron_conclave_candidates:0 "Matrons"
    aeluran_matron_conclave_candidates_tooltip:0 "In order to be a valid Candidate under $aeluran_conclave_succession_law$, a character must be a Matron of the Aeluran Order holding a [matron_seat|E]."
    aeluran_matron_conclave_electors:0 "The Council of Matrons"
    aeluran_matron_conclave_electors_tooltip:0 "In order to be a valid [elector|E] under $aeluran_conclave_succession_law$, a character must be a Matron of the Aeluran Order holding a [matron_seat|E], or the sitting High Matriarch."
    CANT_CHANGE_AELURAN_CONCLAVE_LAW_TOOLTIP:0 "The [succession_laws|E] of the High Matriarch cannot be changed: the [council_of_matrons|E] always elects her successor"

    # The Council of Matrons window (gui/window_cardinals.gui for the Aeluran faiths)
    AELURAN_COLLEGE_VIEW_TITLE:0 "Council of Matrons"
    AELURAN_COLLEGE_VIEW_MATRIARCH:0 "High Matriarch: [Character.GetShortUINameNotMeNoTooltip]"
    AELURAN_COLLEGE_VIEW_INTERACTIONS_BUTTON_TT:0 "#T Show Matron Interactions#!"
    AELURAN_COLLEGE_VIEW_WILL_VOTE_FOR:0 "Matrons voting for [Character.GetShortUINameNoTooltip|U] to take the Seat"
    AELURAN_COLLEGE_VIEW_CANDIDACY_SCORES:0 "[matron_candidacy|E]"
    AELURAN_COLLEGE_VIEW_CANDIDACY_SCORE:0 "[matron_candidacy|E]"
    AELURAN_FAITH_VIEW_COUNCIL_OF_MATRONS:0 "#T [council_of_matrons|E]#!\n\n#I Click to view#!"

    # Game concepts
    game_concept_council_of_matrons:0 "Council of Matrons"
    game_concept_council_of_matrons_desc:0 "The Council of Matrons is the leadership council of the Aeluran Order, and it chooses the High Matriarch.\n\nEvery Matron holds a [matron_seat|E] on the Council. When the High Matriarch dies, the Matrons elect her successor from among themselves: each Matron is both an [elector|E] and a candidate. The High Matriarch votes too: whom she names to succeed her sways the Matrons loyal to her. At any time three Matrons stand as candidates, the strongest in each [matron_candidacy|E].\n\nThe new High Matriarch takes the Seat of the High Matriarch and Spirits' Landing, home of the Deep Wood Sanctum. She keeps the lands she already rules, and the late Matriarch's own lands pass to her family.\n\nA High Matriarch's death does not end your game: you continue as her heir, and may choose to guide the Order as the new High Matriarch instead. With no landed heir, you continue as the new High Matriarch."
    game_concept_matron_seat:0 "Matron's Seat"
    game_concept_matron_seats:0 "Matron's Seats"
    game_concept_matron_candidacy:0 "Candidacy"
    game_concept_matron_candidacies:0 "Candidacies"
    game_concept_matron_candidacy_desc:0 "How strongly a Matron could stand before the [council_of_matrons|E] as each kind of candidate:\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_spark_touched$#!: Elven ascension, magical talent, learning and devotion\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_highborn$#!: purity of blood, royal Elven blood and congenital gifts\n$EFFECT_LIST_BULLET$#EMP $aeluran_conclave_regnant$#!: realm, the rulers of her Matronate, prestige and diplomacy\n\nThe Matron with the highest score in each stands for election."

    # Candidate archetypes
    aeluran_conclave_spark_touched:0 "The Spark-Touched"
    aeluran_conclave_spark_touched_desc:0 "#flavor The Council puts forward the sister in whom the Divine Spark burns brightest.#!\n\nTo become #EMP $aeluran_conclave_spark_touched$#!, a Matron must be the most gifted in the Spark: the most ascended of Elves, the greatest magical talent, the keenest learning, and the deepest devotion.\n\n$EFFECT_LIST_BULLET$Elven ascension: #V +75#! Ainur, #V +50#! Celestial, #V +25#! Fae, #V +10#! High Elf\n$EFFECT_LIST_BULLET$Magical talent: #V +30#! / #V +15#! / #V +5#! for the third, second and first rank\n$EFFECT_LIST_BULLET$#V +1#! per point of [learning|E]\n$EFFECT_LIST_BULLET$#V +5#! per [piety_level|E]"
    aeluran_conclave_highborn:0 "The Highborn"
    aeluran_conclave_highborn_desc:0 "#flavor The Sisterhood weaves bloodlines, and some would see the finest of them take the Seat.#!\n\nTo become #EMP $aeluran_conclave_highborn$#!, a Matron must be of the finest blood: pure of line, of royal Elven blood, and gifted in beauty, mind and body.\n\n$EFFECT_LIST_BULLET$Purity of blood: #V +50#! [GetTrait('purest_blooded').GetName( GetNullCharacter )], #V +30#! [GetTrait('purer_blooded').GetName( GetNullCharacter )], #V +15#! [GetTrait('pure_blooded').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$#V +25#! of a royal Elven bloodline\n$EFFECT_LIST_BULLET$Beauty, intellect and physique: up to #V +15#! each, by how good the trait is\n$EFFECT_LIST_BULLET$#V +10#! if [GetTrait('born_in_the_red').GetName( GetNullCharacter )]"
    aeluran_conclave_regnant:0 "The Regnant"
    aeluran_conclave_regnant_desc:0 "#flavor The Order has enemies as well as followers, so the Council puts forward a Matron with the means to hold the Seat.#!\n\nTo become #EMP $aeluran_conclave_regnant$#!, a Matron must command the most temporal power: the greatest realm, the mightiest flock, the most prestige, and a diplomat's tongue.\n\n$EFFECT_LIST_BULLET$Highest title: #V +30#! Empire, #V +20#! Kingdom, #V +10#! Duchy, #V +5#! County\n$EFFECT_LIST_BULLET$#V +5#! per [prestige_level|E]\n$EFFECT_LIST_BULLET$#V +1#! per two points of [diplomacy|E]
$EFFECT_LIST_BULLET$Each Aeluran ruler seated in her Matronate: #V +20#! Emperor, #V +12#! King, #V +4#! Duke, #V +1#! Count, up to #V +60#! in all"

    # Voting reasons
    aeluran_conclave_vote_myself:0 "Stands for the Seat herself: $VALUE|=+0$"
    aeluran_conclave_vote_myself_ambitious:0 "Covets the Seat for herself: $VALUE|=+0$"
    aeluran_conclave_vote_not_myself:0 "Does not truly covet the Seat: $VALUE|=+0$"
    aeluran_conclave_vote_same_rite:0 "A sister of her own rite: $VALUE|=+0$"
    aeluran_conclave_vote_same_sisterhood:0 "A sister of her own Sisterhood: $VALUE|=+0$"
    aeluran_conclave_vote_other_rite:0 "Of the other Sisterhood: $VALUE|=+0$"
    aeluran_conclave_vote_matriarch_choice_liked:0 "The High Matriarch has chosen [candidate.GetHerHim] as her successor, and I think well of the Matriarch: $VALUE|=+0$"
    aeluran_conclave_vote_matriarch_choice_disliked:0 "The High Matriarch has chosen [candidate.GetHerHim] as her successor, and I think ill of the Matriarch: $VALUE|=+0$"
    aeluran_conclave_vote_own_daughter:0 "Her own daughter: $VALUE|=+0$"
    aeluran_conclave_vote_born_in_the_red:0 "[candidate.GetSheHe|U] was [GetTrait('born_in_the_red').GetName( GetNullCharacter )]: $VALUE|=+0$"

    # Matron's Seat titles and the Matron style
    aeluran_matron_seat_duchy:0 "Matron's Seat"
    aeluran_matron_female:0 "Matron"
    aeluran_matron_seat_name_county:0 "[matron_seat_county.GetNameNoTierNoTooltip]"
    aeluran_matron_seat_adj_county:0 "[matron_seat_county.GetBaseNameNoTooltip]"
    aeluran_matron_seat_name_person:0 "[matron_seat_recipient.GetFirstNameNoTooltip]"
    aeluran_matron_seat_adj_person:0 "[matron_seat_recipient.GetFirstNameNoTooltip]"

    # The Seat passes (the player who played the late High Matriarch)
    aeluran_repeating.008.title:0 "The Seat Passes"
    aeluran_repeating.008.desc:0 "[dead_aeluran.GetName] has returned to the Divine Spark, and the Council of Matrons has raised [new_matriarch.GetName] to the Seat of the High Matriarch.\n\n"
    aeluran_repeating.008.desc_lands:0 "Her own lands have passed to you. "
    aeluran_repeating.008.desc_choice:0 "You may carry on her line, or take up the mantle of The Red and guide the Aeluran Order as its new High Matriarch."
    aeluran_repeating.008.a:0 "I will carry on her line."
    aeluran_repeating.008.b:0 "I will guide the Order as [new_matriarch.GetFirstName]."

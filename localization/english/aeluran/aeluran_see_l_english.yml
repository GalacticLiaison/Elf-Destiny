l_english:
 aeluran_see.0001.t: "The See of [fallen_see_capital.GetNameNoTier] Falls to the Order"
 aeluran_see.0001.desc: "The bells of [fallen_see_capital.GetName] ring for the Weavers now. Its people kneel to the Order, and the priests of the foreign church no longer hold the land.\n\nFor generations this see answered to a church that tithed our people and preached against our kind. No longer. Its seat and every parish under it pass to the Aeluran Order, and a Matron shall keep them."
 aeluran_see.0001.a: "Let the Weave cover what they once claimed."
 aeluran_see.0002.t: "The Loss of the See of [fallen_see_capital.GetNameNoTier]"
 aeluran_see.0002.desc.prelate: "Word has come from [fallen_see_capital.GetName]. The city has turned to the heathen Weavers under [see_conqueror.GetTitledFirstName], and with it the see is lost to their Order.\n\nThe see I was charged to keep has been taken from me. Its parishes answer to a heathen Matron now, and its clergy are scattered."
 aeluran_see.0002.desc.flock: "Word has come from [fallen_see_capital.GetName]. The city has turned to the heathen Weavers under [see_conqueror.GetTitledFirstName], and with it the see is lost to their Order.\n\nThe faithful of [fallen_see_faith.GetName] in these lands have lost their shepherd, and the elves rejoice at our loss."
 aeluran_see.0002.a: "This shall not be forgotten."

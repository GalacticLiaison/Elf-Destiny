l_english:
 aeluran_see.0001.t: "The Fall of [fallen_see.GetNameNoTierNoTooltip]"
 aeluran_see.0001.desc: "The bells of [fallen_see_capital.GetName] have fallen silent. Its people now kneel to the Weavers, and the priests of [fallen_see_faith.GetName] no longer hold the land.\n\nFor generations [fallen_see.GetName] answered to a foreign church that tithed our people and preached against our kind. No longer. Its seat lies empty, its rolls are burned, and its authority is broken."
 aeluran_see.0001.a: "Let the Weave cover what they once claimed."
 aeluran_see.0002.t: "The Loss of [fallen_see.GetNameNoTierNoTooltip]"
 aeluran_see.0002.desc.prelate: "Word has come from [fallen_see_capital.GetName]. The city has turned to the heathen Weavers under [see_conqueror.GetTitledFirstName], and with it [fallen_see.GetName] is no more.\n\nThe see I was charged to keep has been taken from me. Its clergy are scattered and its seat stands empty."
 aeluran_see.0002.desc.flock: "Word has come from [fallen_see_capital.GetName]. The city has turned to the heathen Weavers under [see_conqueror.GetTitledFirstName], and with it [fallen_see.GetName] is no more.\n\nThe faithful of [fallen_see_faith.GetName] in these lands have lost their shepherd, and the elves rejoice at our loss."
 aeluran_see.0002.a: "This shall not be forgotten."

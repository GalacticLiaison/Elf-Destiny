l_english:
    # Placing Sisters (Advisor appointment)
    aeluran_appoint_advisor_interaction:0 "Appoint an Advisor"
    aeluran_appoint_advisor_interaction_desc:0 "Choose a Sister of the Order to serve [recipient.GetShortUIName] as Aeluran Advisor, the Order's Red Sister at [recipient.GetHerHis] court.\n\nThe post is yours to fill. If you leave it open, the Order will fill it in time."
    aeluran_appoint_advisor_tt:0 "[secondary_recipient.GetShortUIName] becomes the Aeluran Advisor of [recipient.GetShortUIName]"
    aeluran_appoint_advisor_no_candidate_tt:0 "No free Sister within your reach: send for a novice from Deepwood instead"
    aeluran_send_novice_advisor_interaction:0 "Send for a Novice"
    aeluran_send_novice_advisor_interaction_desc:0 "Send for a Sister newly trained at the Deep Wood Sanctum to serve [recipient.GetShortUIName] as Aeluran Advisor. She will travel from Deepwood."
    aeluran_send_novice_advisor_tt:0 "A newly trained Sister leaves Deepwood to serve [recipient.GetShortUIName] as Aeluran Advisor"
    aeluran_recall_advisor_interaction:0 "Recall Advisor"
    aeluran_recall_advisor_interaction_desc:0 "Recall [recipient.GetShortUIName]'s Aeluran Advisor from [recipient.GetHerHis] court. The post opens again for a Sister of your choosing."
    aeluran_recall_advisor_tt:0 "[recalled_advisor.GetShortUIName] is recalled from [recipient.GetShortUIName]'s court"
    aeluran_recall_advisor_post_opens_tt:0 "The Advisor post opens again"
    aeluran_recalled_advisor_opinion:0 "Recalled an Advisor"
    aeluran_advisor_post_open_toast:0 "An Advisor Post Awaits"
    aeluran_advisor_post_open_toast_desc:0 "[advisor_post.GetShortUIName] needs an Aeluran Advisor, and the choice is yours."
    action_aeluran_advisor_post_open:0 "Advisor Post Open"
    action_aeluran_advisor_post_open_label:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_desc:0 "[recipient.GetShortUIName] needs an Aeluran Advisor, and the choice is yours. If you leave the post open, the Order will fill it in time."
    action_aeluran_advisor_post_open_click:0 "#I Click to appoint an Advisor#!"
    action_aeluran_advisor_post_open_combined_label:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_label:0 "$NUM$ Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_name:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_description:0 "Rulers of your flock who need an Aeluran Advisor of your choosing"

    # The Order window (gui/aeluran_order_window.gui)
    AELURAN_ORDER_BUTTON_TT:0 "#T The Order#!\nYour flock: the Aeluran rulers in your care and the Red Sisters who advise them."
    AELURAN_ORDER_WINDOW_TITLE:0 "Your Flock"
    AELURAN_ORDER_FLOCK_PIETY:0 "Your flock yields you @piety_icon! #P [GetPlayer.MakeScope.Var('aeluran_flock_piety').GetValue|1]#! [piety|E] a month"
    AELURAN_ORDER_ROW_DEVOTION:0 "Devotion: [Character.GetSpiritualFulfillmentLevel.GetName]"
    AELURAN_ORDER_ASSIGN:0 "Assign"
    AELURAN_ORDER_ASSIGN_TT:0 "Choose the Sister who will advise [Character.GetShortUIName]"
    AELURAN_ORDER_NO_ADVISOR:0 "#weak Awaiting a Sister#!"

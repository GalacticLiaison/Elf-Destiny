l_english:
    # Placing Sisters (Advisor appointment)
    aeluran_appoint_advisor_interaction:0 "Appoint an Advisor"
    aeluran_appoint_advisor_interaction_desc:0 "Choose a Sister of the Order to serve [recipient.GetShortUIName] as Aeluran Advisor, the Order's Red Sister at [recipient.GetHerHis] court.\n\nThe post is yours to fill. If you leave it open, the Order will fill it in time."
    recipient_secondary_aeluran_appoint_advisor_interaction:0 "Red Sister"
    aeluran_appoint_advisor_tt:0 "[secondary_recipient.GetShortUIName] becomes the Aeluran Advisor of [recipient.GetShortUIName]"
    aeluran_appoint_advisor_no_candidate_tt:0 "No free Sister within your reach: send for a novice from Deepwood instead"
    aeluran_send_novice_advisor_interaction:0 "Send for a Novice"
    aeluran_send_novice_advisor_interaction_desc:0 "Send for a Sister newly trained at the Deep Wood Sanctum to serve [recipient.GetShortUIName] as Aeluran Advisor. She will travel from Deepwood."
    aeluran_send_novice_advisor_tt:0 "A newly trained Sister leaves Deepwood to serve [recipient.GetShortUIName] as Aeluran Advisor"
    aeluran_recall_advisor_interaction:0 "Recall Advisor"
    aeluran_recall_advisor_interaction_desc:0 "Recall [recipient.GetShortUIName]'s Aeluran Advisor from [recipient.GetHerHis] court. The post opens again for a Sister of your choosing."
    aeluran_summon_sister_interaction:0 "Summon to Court"
    aeluran_summon_sister_interaction_desc:0 "Order [recipient.GetShortUIName], a Sister of the Order in your care who holds no land and serves at no ruler's side, to come to your court."
    aeluran_summon_sister_tt:0 "[recipient.GetShortUIName] joins your court"
    aeluran_recall_advisor_tt:0 "[recalled_advisor.GetShortUIName] is recalled from [recipient.GetShortUIName]'s court"
    aeluran_recall_advisor_post_opens_tt:0 "The Advisor post opens again"
    aeluran_recalled_advisor_opinion:0 "Recalled an Advisor"
    aeluran_advisor_post_open_toast:0 "An Advisor Post Awaits"
    aeluran_advisor_post_open_toast_desc:0 "[advisor_post.GetShortUIName] needs an Aeluran Advisor, and the choice is yours."
    action_aeluran_advisor_post_open:0 "Advisor Post Open"
    action_aeluran_advisor_post_open_label:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_desc:0 "[recipient.GetShortUIName] needs an Aeluran Advisor, and the choice is yours. If you leave the post open, the Order will fill it in time."
    action_aeluran_advisor_post_open_click:0 "#I Click to appoint an Advisor#!"
    action_aeluran_advisor_post_open_combined_label:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_label:0 "$NUM$ Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_name:0 "Advisor Posts Open"
    action_aeluran_advisor_post_open_combined_group_description:0 "Rulers of your flock who need an Aeluran Advisor of your choosing"

    # The Order window (gui/aeluran_order_window.gui)
    AELURAN_ORDER_BUTTON_TT:0 "#T The Order#!\nYour flock: the Aeluran rulers in your care and the Red Sisters who advise them."
    AELURAN_ORDER_WINDOW_TITLE:0 "Your Flock"
    AELURAN_ORDER_FLOCK_PIETY:0 "Your flock yields you @piety_icon! #P [GetPlayer.MakeScope.Var('aeluran_flock_piety').GetValue|1]#! [piety|E] a month"
    AELURAN_ORDER_ROW_DEVOTION:0 "Devotion: [Character.GetSpiritualFulfillmentLevel.GetName]"
    AELURAN_ORDER_ROW_AUTHORITY:0 "#weak Realm Authority:#! [Character.GetActiveLawInGroupWithFlag('aeluran_realm_authority').GetNameNoTooltip]"
    AELURAN_ORDER_RS_OPINION:0 "[Character.GetFirstNamePossessiveNoTooltip] Opinion: [Character.GetOpinionOf( Character.MakeScope.Var('aeluran_order_red_sister').GetCharacter )|+=]"
    AELURAN_ORDER_RS_SPOUSE:0 "Spouse"
    no_aeluran_law:0 "None"
    AELURAN_ORDER_ASSIGN:0 "Assign"
    AELURAN_ORDER_ASSIGN_TT:0 "Choose the Sister who will advise [Character.GetShortUIName]"
    AELURAN_ORDER_NO_ADVISOR:0 "#weak Awaiting a Sister#!"

    # The Order window tabs
    AELURAN_ORDER_TAB_FLOCK:0 "Flock"
    AELURAN_ORDER_TAB_BLOODLINES:0 "Bloodlines"
    AELURAN_ORDER_TAB_SISTERS:0 "Sisters"
    AELURAN_ORDER_SISTERS_HEADER:0 "The Sisters of the Order in your care. Those who hold an Aeluran ruler's temples in lease send you a share of their tithes."
    AELURAN_ORDER_SISTER_TITHE:0 "Tithe to you: [gold_i]#V [Multiply_CFixedPoint( Character.GetIncomeFromTheocraticLease, GetPlayer.MakeScope.Var('aeluran_order_tithe_share').GetValue )|1]#!/month from [Character.GetNumTitlesFromTheocraticLease] temples"
    AELURAN_ORDER_SISTER_RULES:0 "Rules [Character.GetPrimaryTitle.GetNameNoTooltip]"
    AELURAN_ORDER_SISTER_NO_HOLDINGS:0 "#weak Holds no temples in lease#!"
    AELURAN_ORDER_SISTER_ADVISES:0 "Red Sister to [Character.GetLiege.GetShortUIName]"
    AELURAN_ORDER_SISTER_LOCATION:0 "#weak At the court of [Character.GetEmployer.GetShortUIName]#!"
    AELURAN_ORDER_SISTER_ADVISOR_TT:0 "#T Red Sister#!\n[Character.GetShortUIName] sits on the council of [Character.GetLiege.GetShortUIName] as the Order's Advisor."

    # The Bloodlines board
    AELURAN_BL_CHOOSE:0 "Choose two unwed elves in your care, then propose the match."
    AELURAN_BL_FIRST:0 "#weak First:#! [GetPlayer.MakeScope.Var('aeluran_bl_first').GetCharacter.GetShortUIName]"
    AELURAN_BL_SECOND:0 "#weak Second:#! [GetPlayer.MakeScope.Var('aeluran_bl_second').GetCharacter.GetShortUIName]"
    AELURAN_BL_PROPOSE:0 "Propose Match"
    AELURAN_BL_SELECT:0 "Choose"
    AELURAN_BL_ROW_INFO:0 "[Character.GetAge] years old, of [Character.GetHouse.GetName]"
    AELURAN_BL_ROW_WORTH:0 "Blood worth #V [Character.MakeScope.ScriptValue('genetic_worthiness')|0]#!"
    aeluran_bl_cannot_wed_tt:0 "These two cannot be wed"
    aeluran_bl_awaiting_answer_tt:0 "A proposal of yours still awaits an answer"
    aeluran_bloodlines_proposed_toast:0 "A Match Proposed"
    aeluran_bloodlines_proposed_toast_desc:0 "You have proposed a match between [bl_a.GetShortUIName] and [bl_b.GetShortUIName]. Their guardians will answer."
    aeluran_bloodlines_refused_toast:0 "A Match Refused"
    aeluran_bloodlines_refused_toast_desc:0 "The match between [bl_a.GetShortUIName] and [bl_b.GetShortUIName] was refused. Neither may be proposed again for five years."
    aeluran_bloodlines_match_made_toast:0 "A Match Made"
    aeluran_bloodlines_match_made_toast_desc:0 "[bl_a.GetShortUIName] and [bl_b.GetShortUIName] are to be wed, as the Order wills."
    aeluran_bloodlines_gifted_child_toast:0 "A Gifted Child"
    aeluran_bloodlines_gifted_child_toast_desc:0 "[bl_child.GetShortUIName] is born of a match you made, and the blood runs true."
    aeluran_arranged_a_fine_match_opinion:0 "Arranged a fine match"

    # A shepherd proposes a match for a player's ward
    aeluran_bloodlines.001.t:0 "A Match for the Order"
    aeluran_bloodlines.001.desc_ward:0 "[bl_matron.GetTitledFirstName] has taken an interest in [bl_ward.GetShortUIName].\n\n"The Spark runs strong in [bl_ward.GetHerHim], and stronger still in [bl_partner.GetShortUIName]. Their children would honour both your houses. The Order would see them wed."\n\nShe smiles, as though the answer were already given."
    aeluran_bloodlines.001.desc_self:0 "[bl_matron.GetTitledFirstName] has come with a proposal of her own.\n\n"The Order has watched your line with interest. [bl_partner.GetShortUIName] would make you a fitting match, and your children would carry the Spark further than either of you alone."\n\nShe smiles, as though the answer were already given."
    aeluran_bloodlines.001.a:0 "The Order knows best."
    aeluran_bloodlines.001.b:0 "No. This is not the Order's to decide."

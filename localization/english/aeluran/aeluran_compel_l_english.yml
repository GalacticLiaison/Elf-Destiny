l_english:
    # Compelling a defiant Sister (events/aeluran/aeluran_compel_events.txt)
    aeluran_compel_on_decline_tt:0 "If she refuses, you may let it stand or #V force her with a Battle of Wills#!"
    aeluran_appoint_advisor_refuses_tt:0 "#N [secondary_recipient.GetShortUIName] will refuse this posting#!: you may let it stand or #V force her with a Battle of Wills#!"
    aeluran_summon_attached_reason:0 "Attachment to [recipient.GetEmployer.GetShortUIName]: $VALUE|=+0$"
    aeluran_summon_spouse_reason:0 "Would leave her spouse behind: $VALUE|=+0$"

    aeluran_compel.001.title:0 "A Sister Defies You"
    aeluran_compel.001.desc_whispers:0 "[compel_sister.GetFirstNameNoTooltip] hears me out, then folds her hands. "I serve the Order at [compel_sister.GetLiege.GetShortUIName]'s side, Mother. I will not turn spy on the court that trusts me.""
    aeluran_compel.001.desc_summon:0 "My summons reached [compel_sister.GetFirstNameNoTooltip], and her answer came back plain: she will not leave the life she has made to wait upon me."
    aeluran_compel.001.desc_advisor:0 "[compel_sister.GetFirstNameNoTooltip] will not go. "Send another to [recipient.GetShortUIName], Mother. I will not sit at that council, and I will not pretend to.""
    aeluran_compel.001.desc_end:0 "\n\nA Sister does not refuse her Matron. I could let it pass, or I could bend her to my will. But if my will proves the weaker, every Sister in my care will hear of it."
    aeluran_compel.001.a:0 "Very well. Let it stand."
    aeluran_compel.001.b:0 "You will obey. (Battle of Wills: [learning_i] Learning)"
    aeluran_compel.001.c:0 "You will obey. (Battle of Wills: [intrigue_i] Intrigue and [diplomacy_i] Diplomacy)"
    aeluran_compel_win_tt:0 "[compel_sister.GetShortUIName] bows to your will and does as she is told, though she resents it"
    aeluran_compel_lose_tt:0 "Her will overpowers yours. #N The backlash leaves you stressed and diminished, the worse the more she outmatched you#!, and the Sisters in your care hear of it"

    aeluran_bent_to_her_will_opinion:0 "Bent to Her Will"
    aeluran_humbled_by_a_sister_opinion:0 "Humbled by a Sister"

    aeluran_will_recoiling_modifier:0 "Will Recoiling"
    aeluran_will_recoiling_modifier_desc:0 "This character lost a battle of wills to a Sister of the Order, and [ROOT.Char.GetHerHis] will has not yet recovered."
    aeluran_will_shattered_modifier:0 "Will Shattered"
    aeluran_will_shattered_modifier_desc:0 "This character's will was crushed in a battle of wills with a Sister of the Order. The backlash runs deep."

    # Press the Order's Claim (aeluran_press_authority_interaction)
    aeluran_press_authority_interaction:0 "Press the Order's Claim"
    aeluran_press_authority_interaction_desc:0 "Urge [recipient.GetShortUIName] to raise the [aeluran_realm_authority|E] of [recipient.GetHerHis] realm a step beyond [recipient.GetActiveLawInGroupWithFlag('aeluran_realm_authority').GetNameNoTooltip]. [recipient.GetHerHis|U] Red Sister will argue your case at court, if she still holds to the Order over [recipient.GetHerHim].\n\nIf [recipient.GetSheHe] refuses, you may force the matter in a Battle of Wills, yourself or through [recipient.GetHerHis] Red Sister."
    aeluran_press_authority_accept_tt:0 "[recipient.GetShortUIName] raises [recipient.GetHerHis] [aeluran_realm_authority|E] one step, paying the law's usual cost; you gain [piety|E] and the Red Sister's favor"
    aeluran_press_authority_on_decline_tt:0 "If [recipient.GetSheHe] refuses, you may let it stand or #V force it in a Battle of Wills#!"
    aeluran_press_strong_hook_auto_accept:0 "You hold a [strong_hook|E] on [recipient.GetShortUIName]"
    aeluran_press_judiciary_reason:0 "Would hand the Order the courts of the realm: $VALUE|=+0$"
    aeluran_press_devotion_reason:0 "Devotion to the Order: $VALUE|=+0$"
    aeluran_press_red_sister_for_reason:0 "Your Red Sister argues your case at court: $VALUE|=+0$"
    aeluran_press_red_sister_trust_reason:0 "Trust in the Red Sister: $VALUE|=+0$"
    aeluran_press_red_sister_against_reason:0 "The Red Sister has gone native and argues against you: $VALUE|=+0$"
    aeluran_press_no_red_sister_reason:0 "No Red Sister at court to argue your case: $VALUE|=+0$"
    aeluran_press_at_war_reason:0 "At war, and in want of the Order's magi: $VALUE|=+0$"
    aeluran_press_zealous_reason:0 "Zealous: $VALUE|=+0$"
    aeluran_press_cynical_reason:0 "Cynical: $VALUE|=+0$"
    aeluran_press_ambitious_reason:0 "Ambitious: $VALUE|=+0$"
    aeluran_press_arrogant_reason:0 "Arrogant: $VALUE|=+0$"

    aeluran_compel.010.title:0 "The Order Refused"
    aeluran_compel.010.desc:0 "[compel_ruler.GetTitledFirstName] has heard the Order's case, and turned it away. [compel_ruler.GetSheHe|U] will not give the Sisters more of [compel_ruler.GetHerHis] realm than they already hold.\n\nI could accept this. Or I could see that [compel_ruler.GetSheHe] does as the Order requires, by my own will or by that of the Sister who sits at [compel_ruler.GetHerHis] side."
    aeluran_compel.010.a:0 "Let [compel_ruler.GetHerHim] keep [compel_ruler.GetHerHis] pride, for now."
    aeluran_compel.010.b:0 "I will bend [compel_ruler.GetHerHim] myself. (Battle of Wills: [learning_i] Learning)"
    aeluran_compel.010.c:0 "I will bend [compel_ruler.GetHerHim] myself. (Battle of Wills: [intrigue_i] Intrigue and [diplomacy_i] Diplomacy)"
    aeluran_compel.010.d:0 "[press_sister.GetFirstNameNoTooltip] will see it done. (Her Battle of Wills: [learning_i] Learning)"
    aeluran_press_win_tt:0 "[compel_ruler.GetShortUIName] yields and raises [compel_ruler.GetHerHis] [aeluran_realm_authority|E], but will long resent being forced"
    aeluran_press_lose_self_tt:0 "[compel_ruler.GetShortUIName]'s will overpowers yours. #N The backlash leaves you stressed and diminished#!, and [compel_ruler.GetSheHe] will not fear you again"
    aeluran_press_lose_sister_tt:0 "[compel_ruler.GetShortUIName] overpowers [press_sister.GetShortUIName]. #N She suffers the backlash, blames you, and may be dismissed#!"
    aeluran_press_forced_ruler_toast:0 "The Order Has Its Way"
    aeluran_press_forced_ruler_toast_desc:0 "[press_champion.GetShortUIName] broke your will, and the [aeluran_realm_authority|E] of your realm rises."

    aeluran_advanced_the_order_opinion:0 "Advanced the Order"
    aeluran_coerced_by_the_order_opinion:0 "Coerced by the Order"
    aeluran_sent_me_to_fail_opinion:0 "Sent Me to Fail"

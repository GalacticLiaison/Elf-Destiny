    # The High Matriarch's powers
    aeluran_found_matronate_interaction:0 "Found a Matronate"
    aeluran_found_matronate_interaction_desc:0 "Found a new [matronate|E] around [recipient.GetShortUIName]'s home, and entrust it to her. A Sister is raised to Matron.\n\nThe Matronate takes in the counties of the surrounding [kingdom|E] that belong to no other [clerical_region|E]."
    aeluran_entrust_matronate_interaction:0 "Entrust a Matronate"
    aeluran_entrust_matronate_interaction_desc:0 "Give [recipient.GetShortUIName] a [matronate|E], deposing its Matron if it has one. A Sister is raised to Matron.\n\nThe deposed Matron keeps her rank, her [matron_seat|E] and her lands, but not her goodwill, and the rest of the [council_of_matrons|E] will take it ill."
    aeluran_matronate_home_county_tt:0 "Her home must be an Aeluran [county|E] that belongs to no [clerical_region|E] and is not Spirits' Landing"
    aeluran_matronate_break_realm_tt:0 "She rules land under a Duke or a Count: a Matronate would raise her above her [liege|E]"
    aeluran_matronate_entrust_realm_outside_tt:0 "Her realm must lie within the chosen Matronate"
    aeluran_matronate_raised_tt:0 "[recipient.GetShortUIName] is raised to Aeluran Matron"
    aeluran_matronate_found_tt:0 "A new [matronate|E] is founded around her home, and entrusted to her"
    aeluran_matronate_entrust_tt:0 "[recipient.GetShortUIName] is entrusted with the [target.GetName]"
    aeluran_matronate_deposed_tt:0 "[target.GetHolder.GetShortUIName] is deposed. She keeps her rank, her [matron_seat|E] and her lands"
    aeluran_matronate_founded_name:0 "[matronate_found_county.GetNameNoTierNoTooltip]"
    aeluran_matronate_founded_adj:0 "[matronate_found_county.GetBaseNameNoTooltip]"
    aeluran_meddled_in_matronate_opinion:0 "Meddled with a Matronate"
    aeluran_matronate_deposed_toast:0 "Deposed"
    aeluran_matronate_deposed_toast_desc:0 "High Matriarch [actor.GetName] has taken the [matronate.GetName] from you and entrusted it to [matronate_successor.GetName]. You keep your rank, your [matron_seat|E] and your lands."


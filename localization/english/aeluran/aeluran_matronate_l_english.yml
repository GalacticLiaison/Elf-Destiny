    # Aeluran temple lease (common/lease_contracts/elf_dest_aeluran_lease.txt)
    aeluran_lease:0 "Aeluran Lease"
    aeluran_lease_desc:0 "This temple is [leased|E] to the Aeluran Advisor of its holder, the Order's Sister at court.\n\nShe contributes [tax|E] and [levies|E] to her [liege|E] (if she approves of them), to the Matron of the [matronate|E] that her liege's [capital|E] lies in, and to the High Matriarch directly. Where there is no Matron, her share goes to the High Matriarch."
    AELURAN_LEASE_RATIO_MATRONATE:0 "Tithe to the Matron of the Matronate"
    AELURAN_LEASE_RATIO_HIGH_MATRIARCH:0 "Tithe to the High Matriarch"

    # Succession toast (players whose realm lies in the Matronate)
    aeluran_matronate_new_matron_toast:0 "A New Matron"
    aeluran_matronate_new_matron_toast_desc:0 "[matronate_successor.GetName] is raised to Matron and entrusted with the [matronate.GetName]."

    # Game concept
    game_concept_matronate:0 "Matronate"
    game_concept_matronates:0 "Matronates"
    game_concept_matronate_desc:0 "A Matronate is the Aeluran form of a [clerical_region|E]: a region of the elven world entrusted to a Matron of the Order. Every Sister within it answers to its Matron.\n\nOnly a Matron may hold a Matronate, and she may hold only one. A Matronate never passes to its Matron's family: when she dies, is elected High Matriarch, or leaves the faith, the Council of Matrons raises a Sister, preferably one of the region, to Matron to take her place. The High Matriarch may found new Matronates, or replace a Matron, at great cost.\n\nSpirits' Landing, home of the Deep Wood Sanctum, lies outside every Matronate: it is the High Matriarch's own see."

l_english:
    # Gather Whispers (common/character_interactions/aeluran_advisor_interactions.txt)
    aeluran_gather_whispers_interaction:0 "Gather Whispers"
    aeluran_gather_whispers_interaction_desc:0 "Set [recipient.GetShortUIName], the Order's Red Sister at the court of [recipient.GetLiege.GetShortUIName], to listen for the secrets kept there. For up to a year she will search for what [recipient.GetLiege.GetShortUIName] and [recipient.GetLiege.GetHerHis] courtiers would rather hide, and write to you of anything she learns.\n\nShe may be caught at it. A Sister who thinks little of you may refuse, and one who has come to love her ruler more than the Order may tell [recipient.GetLiege.GetHerHim]."
    aeluran_whispers_already_tt:0 "[recipient.GetShortUIName] is already gathering whispers"
    aeluran_whispers_loyal_sister_auto_accept:0 "[recipient.GetShortUIName] is bound to you and will not refuse"
    aeluran_whispers_accept_tt:0 "[recipient.GetShortUIName] begins listening at the court of [recipient.GetLiege.GetShortUIName]"
    aeluran_whispers_betrayal_tt:0 "#N [recipient.GetShortUIName] tells [recipient.GetLiege.GetShortUIName] what you asked of her#!"
    aeluran_whispers_loyal_to_ruler_reason:0 "Devotion to [recipient.GetLiege.GetShortUIName]: $VALUE|=+0$"
    aeluran_whispers_rival_reason:0 "You are her [rival|E]: $VALUE|=+0$"
    aeluran_whispers_deceitful_reason:0 "Deceitful: $VALUE|=+0$"
    aeluran_whispers_honest_reason:0 "Honest: $VALUE|=+0$"
    aeluran_whispers_zealous_reason:0 "Zealous: $VALUE|=+0$"

    aeluran_spied_on_my_court_opinion:0 "Spied on My Court"

    # Toasts
    aeluran_whispers_betrayed_toast:0 "[whisper_sister.GetShortUIName] Betrayed You"
    aeluran_whispers_betrayed_toast_desc:0 "[whisper_sister.GetShortUIName] refused to spy for you and told [whisper_ruler.GetShortUIName] what you asked."
    aeluran_whispers_betrayed_ruler_toast:0 "A Plot Revealed"
    aeluran_whispers_betrayed_ruler_toast_desc:0 "[whisper_sister.GetShortUIName], your Red Sister, tells you that [actor.GetShortUIName] asked her to spy on your court."
    aeluran_whispers_caught_toast:0 "[whisper_sister.GetShortUIName] Was Caught"
    aeluran_whispers_caught_toast_desc:0 "[whisper_sister.GetShortUIName] was caught listening at the court of [whisper_ruler.GetShortUIName], who knows you sent her."
    aeluran_whispers_caught_ruler_toast:0 "A Spy at Court"
    aeluran_whispers_caught_ruler_toast_desc:0 "[whisper_sister.GetShortUIName], your Red Sister, was caught gathering secrets at your court for [whisper_shepherd.GetShortUIName]."
    aeluran_whispers_nothing_toast:0 "No Whispers"
    aeluran_whispers_nothing_toast_desc:0 "A year at the court of [whisper_ruler.GetShortUIName], and [whisper_sister.GetShortUIName] heard nothing worth writing to you about."

    # The Sister's letter
    aeluran_whispers.010.opening:0 "To [ROOT.Char.GetTitledFirstName], from the court of [whisper_ruler.GetPrimaryTitle.GetNameNoTooltip],"
    aeluran_whispers.010.desc:0 "As you asked, I have listened. What I have learned is this: [whisper_holder.GetTitledFirstName] [whisper_secret.Custom('SecretDescriptionThirdPerson')].\n\nNo one here knows I have written to you. Do with it as the Order requires.\n\nYour Sister,\n[whisper_sister.GetFirstNameNoTooltip]"
    aeluran_whispers.010.a:0 "This stays between us, for now."
    aeluran_whispers.010.b:0 "Let it be known."

    # Order window, Sisters tab
    AELURAN_ORDER_SISTER_WHISPERING:0 "#V Gathering whispers#! at the court of [Character.GetLiege.GetShortUIName] ([Character.MakeScope.Var('aeluran_whispers_months').GetValue|0] months left)"
    AELURAN_ORDER_WHISPERS_TT:0 "#T Gather Whispers#!\nSet [Character.GetShortUIName] to spy on the court of [Character.GetLiege.GetShortUIName] for you, for up to a year."

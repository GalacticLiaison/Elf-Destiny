 trait_royal_elf_syldranis:0 "Bloodline of House Syldranis"
 trait_royal_elf_syldranis_desc:0 "Descended from the ancient Drow house of Syldranis, this bloodline reveres the serpent god Typhos with fervent zeal, pursuing reckless experiments in evolutionary ascent. Their progeny adapt swiftly across generations, blessed with uncanny resilience yet cursed by volatile mutations."
 trait_royal_elf_syldranis_character_desc:0 "Genetic ascendance and absurdity marks a Syldranis"
 rare_genetic_more_common_bonus:0 "#medium [rare_genetic_traits|E] are more common#!\n\n"

 trait_royal_elf_drenmyre:0 "Bloodline of House Drenmyre"
 trait_royal_elf_drenmyre_desc:0 "The ancient dark elf lords of House Drenmyre reign with unrelenting tyranny, their piercing eyes sowing dread in vassal and foe alike. Through ruthless oppression, they bind their realm in fear, quelling dissent with an iron hand. Yet, such merciless rule breeds isolation, as allies shun their shadowed court and whispers of rebellion stir."
 trait_royal_elf_drenmyre_desc_character_desc:0 "Eyes that peirce and an umbra of fear marks a Drenmyre"

 trait_royal_elf_myrvessa:0 "Bloodline of House Myrvessa"
 trait_royal_elf_myrvessa_desc:0 "Descended from the ancient Drow matriarchs of House Myrvessa, this bloodline is blessed by Lloth’s divine favor, weaving ruthless schemes to advance her will and their dominion. Their unyielding loyalty binds the house in unbreakable unity, yet their treachery and zeal cast them as pariahs among the realms, their whispered plots ensnaring foes like silken threads."
 trait_royal_elf_myrvessa_character_desc:0 "Ambition and treachery marks one as Myrvessa"

 trait_royal_elf_rynvela:0 "Bloodline of House Rynvela"
 trait_royal_elf_rynvela_desc:0 "The ancient dark elf lords of House Rynvela bear a profound bond with the spirit realm, their black lips marking them as conduits of otherworldly power. Renowned for necromancers and wielders of ethereal sparks, they commune ceaselessly with spirits, their gaze fixed upon the unseen realm. Yet, this obsession drives many to madness, their minds unraveling under the weight of spectral whispers."
 trait_royal_elf_rynvela_character_desc:0 "Lips of Black and mutters to the unseen marks a Rynvela"

 game_concept_elf_ethnicity_accessory_desc:0 "To have better control of racial eye, hair, and skin color; When selecting a race, a characters color genes are set to the very top left corner of the color pickers by the ethnicity selector.\n\nThis option will add an accessory gene that simulates that, but it doesn't actually change their DNA, its recommended you either go select the actual racial ethnicity or manually select the top left of all color pickers."


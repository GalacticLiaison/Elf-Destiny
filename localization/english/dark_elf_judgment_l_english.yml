l_english:
  # The Judgment of the Spark (dark_elf_story.0001)
  dark_elf_story.0001.t:0 "You Are Known"
  dark_elf_story.0001.desc.intro:0 "The presence holds you and will not let go. In a single heartbeat it weighs your whole life, every kindness and every cruelty, every oath kept and every grudge nursed in the dark. Then it parts the years and shows you two peoples. You see the elves of the sunlit courts, who raised white spires and sang the dawn awake. You see the elves of the moonlit deep, patient and knife-sharp, who wove their power from shadow. The presence looks from them to you, and already it knows which you are. Its verdict settles into your bones."
  dark_elf_story.0001.desc.dark:0 "\n\n#bold 'Shadow.'#!"
  dark_elf_story.0001.desc.light:0 "\n\n#bold 'Light.'#!"
  dark_elf_story.0001.accept_dark:0 "The shadow made me. I will not deny it."
  dark_elf_story.0001.defy_dark:0 "No. I claim the dawn, whatever it costs me."
  dark_elf_story.0001.accept_light:0 "I am the dawn's, as I have always been."
  dark_elf_story.0001.defy_light:0 "No. The shadow calls to me, and I will answer."

  all_party_members_transformed_into_dark_elves:0 "All of your Expedition party members have been transformed into Dark Elves!"
  dark_elf_choose_hue_tt:0 "The Divine Spark will let you choose the form your new people are to wear."

  # The Shaping (dark_elf_story.0002)
  dark_elf_story.0002.t:0 "The Shaping"
  dark_elf_story.0002.desc:0 "#bold 'Choose.'#!\n\nSkin that is"
  dark_elf_story.0002.purple:0 "The #bold violet#! of dusk."
  dark_elf_story.0002.grey:0 "The #bold grey of#! ash and stone."
  dark_elf_story.0002.blue:0 "The #bold blue of#! midnight."
  dark_elf_choose_hair_tt:0 "The Divine Spark will next let you choose the color of your people's hair."

  # The Crowning (dark_elf_story.0004)
  dark_elf_story.0004.t:0 "The Crowning"
  dark_elf_story.0004.desc:0 "#bold 'Choose.'#!\n\nHair that is"
  dark_elf_story.0004.white:0 "The #bold white#! of moonlight."
  dark_elf_story.0004.purple:0 "The #bold violet#! of dusk."
  dark_elf_story.0004.blue:0 "The #bold blue#! of midnight."

  # Adopt an existing elf culture (expedition.00692 third option -> dark_elf_story.0003)
  dark_elf_story.00692.adopt:0 "We shall take up the ways of an elven people of old."
  dark_elf_adopt_culture_tt:0 "The Divine Spark will show you the elven peoples whose memory endures, and you may adopt the ways of one of them."

  # Kindred of Old (dark_elf_story.0003)
  dark_elf_story.0003.t:0 "Kindred of Old"
  dark_elf_story.0003.desc.light:0 "The presence parts the veil of years one last time. You see the elven peoples who came before, each with their own songs, laws, and memories. Their halls are empty now, but their ways endure in the visions the Spark has given you.\n\nJulia would call this the find of a lifetime. You know it as something more. It is an inheritance, waiting to be claimed."
  dark_elf_story.0003.desc.dark:0 "The presence parts the veil of years one last time. You see the shadowed peoples who came before, those who kept their halls beneath stone and starlight and their own counsel besides. Their names were spoken quietly even in the old age, but their ways endure in the visions the Spark has given you.\n\nAn inheritance of dusk, waiting to be claimed."
  dark_elf_story.0003.daelurin:0 "We shall follow the ways of the $elf_culture_daelurin$."
  dark_elf_story.0003.serelion:0 "We shall follow the ways of the $elf_culture_serelion$."
  dark_elf_story.0003.gwynthorn:0 "We shall follow the ways of the $elf_culture_gwynthorn$."
  dark_elf_story.0003.thundarael:0 "We shall follow the ways of the $elf_culture_thundarael$."
  dark_elf_story.0003.valerith:0 "We shall follow the ways of the $elf_culture_valerith$."
  dark_elf_story.0003.lormelis:0 "We shall follow the ways of the $elf_culture_lormelis$."
  dark_elf_story.0003.drow:0 "We shall follow the ways of the $elf_culture_drow$."
  dark_elf_story.0003.dokkalfar:0 "We shall follow the ways of the $elf_culture_dokkalfar$."
  dark_elf_story.0003.none:0 "On reflection, our own ways will serve us still."

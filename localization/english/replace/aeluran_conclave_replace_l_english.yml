l_english:
 # Council of Matrons: the High Matriarch's death is not a game over, so the realm window's no-heir warning
 # (vanilla my_realm_window_l_english.yml) is re-worded for her. Everyone else sees the vanilla text.
 MY_REALM_WINDOW_NO_HEIR_FLAVOR:1 "[SelectLocalization( GetScriptedGui( 'elf_dest_is_high_matriarch' ).IsShown( GuiScope.SetRoot( GetPlayer.MakeScope ).End ), 'AELURAN_MATRIARCH_NO_HEIR_FLAVOR', 'AELURAN_VANILLA_NO_HEIR_FLAVOR' )]"
 AELURAN_VANILLA_NO_HEIR_FLAVOR:0 "@warning_icon! #X You have no heir. The game will end after you die#!"
 # Single-line widget: keep this about as short as the vanilla text. The concept tooltip carries the details.
 AELURAN_MATRIARCH_NO_HEIR_FLAVOR:0 "The [council_of_matrons|E] will choose your successor"

l_english:
 # Dark Elf Beta - dark-aware overrides of Elf Destiny's custom-character (ruler
 # designer preview) race keys from 0lib_urf_race_cooltip_l_english.yml.
 RACE_LOBBY_TEXT_CUSTOM_CHARACTER:0 "[Localize( Concatenate( Select_CString( EqualTo_CFixedPoint( GetGlobalVariable( 'ruler_designer_dark_variant' ).GetValue, '(CFixedPoint)1' ), 'game_concept_dark_', 'game_concept_' ), GetGlobalVariable( 'ruler_designer_selected_race' ).GetFlagName) )]"
 RACE_COOLTIP_GETNAME_CUSTOM_CHARACTER:0 "[Localize( Concatenate( Select_CString( EqualTo_CFixedPoint( GetGlobalVariable( 'ruler_designer_dark_variant' ).GetValue, '(CFixedPoint)1' ), 'game_concept_dark_', 'game_concept_' ), GetGlobalVariable( 'ruler_designer_selected_race' ).GetFlagName) )]:"
 RACE_DESCRIPTION_CUSTOM_CHARACTER:0 "[Localize( Concatenate( Concatenate( Select_CString( EqualTo_CFixedPoint( GetGlobalVariable( 'ruler_designer_dark_variant' ).GetValue, '(CFixedPoint)1' ), 'game_concept_dark_', 'game_concept_' ), GetGlobalVariable( 'ruler_designer_selected_race' ).GetFlagName), '_desc') )]"
 RACE_MODIFIERS_DISPLAYED_CUSTOM_CHARACTER:0 "[GetModifier(Concatenate( Select_CString( EqualTo_CFixedPoint( GetGlobalVariable( 'ruler_designer_dark_variant' ).GetValue, '(CFixedPoint)1' ), 'urf_phenotype_dark_', 'urf_phenotype_' ), Concatenate(GetGlobalVariable( 'ruler_designer_selected_race' ).GetFlagName, '_modifier'))).GetDescWithEffects]"

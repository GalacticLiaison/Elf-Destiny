l_english:
 tradition_elven_professionalism_name:0 "Ancient Elven War Tactics"
 tradition_elven_professionalism_desc:0 "This culture has adopted standardized equipment and training to field armies of professional soldiers, but refuses to raise levies."

 culture_parameter_unlock_maa_elven_spearguard:0 "[GetMaA('elven_spearguard').GetName] as [men_at_arms|E]"
 elven_spearguard:1 "Elven Shieldguard"
 elven_spearguard_flavor:1 "The Elven Shieldguard are the elite heavy infantry of the elven culture's army, wielding large shields and spears. They are trained to hold the line against any foe, and are known for their unbreakable discipline and unwavering loyalty to their commanders."

 culture_parameter_unlock_maa_elven_swordguard:0 "[GetMaA('elven_swordguard').GetName] as [men_at_arms|E]"
 elven_swordguard:1 "Elven Swordguard"
 elven_swordguard_flavor:1 "The Elven Swordguard are the vanguard of the elven culture's army. Lightly armored and wielding greatswords, they are trained to strike quickly and decisively, cutting through enemy lines with ease."

 culture_parameter_unlock_maa_highguard:0 "[GetMaA('highguard').GetName] as [men_at_arms|E]"
 highguard:1 "Highguard"
 highguard_flavor:1 "The Highguard are the elite infantry of the elven culture's army. Clad in heavy armor and wielding the best equipment they can muster, they are the ideal image of discipline and martial mastery."

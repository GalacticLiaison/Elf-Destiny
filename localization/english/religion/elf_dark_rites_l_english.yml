l_english:
  # Mainline rite. It borrows the faith's name and description, but adjective and adherent keys are built from the rite's own key
  aeluran_mainline_rite:0 "$aeluran_weavers$"
  aeluran_mainline_rite_adj:0 "$aeluran_weavers_adj$"
  aeluran_mainline_rite_adherent:0 "$aeluran_weavers_adherent$"
  aeluran_mainline_rite_adherent_plural:0 "$aeluran_weavers_adherent_plural$"
  aeluran_mainline_rite_desc:0 "$aeluran_weavers_desc$"

  # Dark Sisters tenet
  tenet_dark_sisters_name:0 "Dark Sisters"
  tenet_dark_sisters_desc:0 "This rite is under the management of the Dark Sisters, who answer to the High Matriarch as all Sisters do, though they seldom care to be watched while they work. They make excellent matchmakers and wise advisors. To the worthy that is..."
  doctrine_parameter_tenet_dark_sisters:0 "$doctrine_parameter_tenet_aeluran_sisters$"

  # Patron deities of the Dark Elf rites
  doctrine_parameter_commune_with_melkor_unlocked:0 "Unlocks the [GetDecisionWithKey('commune_with_melkor_decision').GetName] [decision|E]"
  doctrine_parameter_commune_with_lloth_unlocked:0 "Unlocks the [GetDecisionWithKey('commune_with_lloth_decision').GetName] [decision|E]"
  doctrine_parameter_commune_with_typhos_unlocked:0 "Unlocks the [GetDecisionWithKey('commune_with_typhos_decision').GetName] [decision|E]"

  tenet_melkor_void_name:0 "Dominion of the Void"
  tenet_melkor_void_desc:0 "Melkor climbed as high as any of the Valar, then looked past the Divine Spark and into the Void that lies behind it. The Dökkálfar hold that the First Dark Lord did not fall at all. He simply stopped pretending, and so should we. To be feared is to be obeyed, and to be obeyed is the only worship He asks."

  tenet_lloth_web_name:0 "Web of the Spider Queen"
  tenet_lloth_web_desc:0 "The Aeluran Sisters weave bloodlines. Lloth weaves everything else. Each whispered plot is a thread in Her web, and House Myrvessa sits at its heart, bound to one another so tightly that no outsider has ever found the gap between them. Those caught in the silk seldom learn whose hand spun it."

  tenet_typhos_ascent_name:0 "The Serpent's Ascent"
  tenet_typhos_ascent_desc:0 "Typhos sheds His skin and is made new, and asks the same of His faithful. House Syldranis sees ascension not as a gift to be awaited but as a work to be hastened, generation upon generation, through rites better left undescribed. Their children adapt with uncanny speed. Not always in the direction intended."

  # Dokkalfar rite: the chapter of the Dark Sisters that worships Melkor
  aeluran_dokkalfar_rite:0 "Sisters of the Void"
  aeluran_dokkalfar_rite_adj:0 "Void"
  aeluran_dokkalfar_rite_adherent:0 "Void Sister"
  aeluran_dokkalfar_rite_adherent_plural:0 "Void Sisters"
  aeluran_dokkalfar_rite_desc:0 "The Sisters of the Void are the chapter of the Dark Sisters who keep the Aeluran faith among the Dökkálfar of the frozen north. They look past the Divine Spark to Melkor, the Fallen Vala, and hold that power is proof of worth and fear the only prayer He hears. For all that, they still bow to the High Matriarch."

  # Myrvessa rite: the chapter of the Dark Sisters that worships Lloth
  aeluran_myrvessa_rite:0 "Sisters of the Silk"
  aeluran_myrvessa_rite_adj:0 "Silken"
  aeluran_myrvessa_rite_adherent:0 "Silken Sister"
  aeluran_myrvessa_rite_adherent_plural:0 "Silken Sisters"
  aeluran_myrvessa_rite_desc:0 "The Sisters of the Silk are the chapter of the Dark Sisters who serve Lloth, the Spider Queen, among the Drow of House Myrvessa. To them a well told lie is an act of devotion and every whispered plot a thread in Her web. They weave bloodlines as the faith demands, and quietly prune them too. For all that, they still bow to the High Matriarch."

  # Syldranis rite: the chapter of the Dark Sisters that worships Typhos
  aeluran_syldranis_rite:0 "Sisters of the Coil"
  aeluran_syldranis_rite_adj:0 "Coiled"
  aeluran_syldranis_rite_adherent:0 "Coiled Sister"
  aeluran_syldranis_rite_adherent_plural:0 "Coiled Sisters"
  aeluran_syldranis_rite_desc:0 "The Sisters of the Coil are the chapter of the Dark Sisters who serve Typhos, the serpent god, among the Drow of House Syldranis. They hold that desire is a gift of the Divine Spark and ascension a work to be hastened, and their children shed one shape for the next with uncanny speed. For all that, they still bow to the High Matriarch."

  # Tenet requirements (tenet_aeluran_sisters / tenet_dark_sisters)
  INCOMPATIBLE_TENET_AELURAN_DARK_SISTERS_TRIGGER:0 "The [GetTenetType('tenet_aeluran_sisters').GetName( GetPlayer.GetRite )] and the [GetTenetType('tenet_dark_sisters').GetName( GetPlayer.GetRite )] cannot share a rite"
  AELURAN_SISTERHOOD_REQUIRES_SPIRITUAL_HEAD_TRIGGER:0 "The Sisterhood answers to the High Matriarch: requires a #V Spiritual#! [head_of_faith|E]"
  AELURAN_SISTERHOOD_REQUIRES_FEMALE_CLERGY_TRIGGER:0 "Only Sisters may serve the Weave: requires #V Female Only#! [clergy|E]"
  AELURAN_SISTERHOOD_REQUIRES_TEMPORAL_THEOCRACY_TRIGGER:0 "The Sisterhood leases its temples: requires #V Temporal#! [theocracy|E]"
  AELURAN_SISTERHOOD_REQUIRES_FIXED_APPOINTMENT_TRIGGER:0 "The Sisterhood appoints its own: requires #V Fixed Appointment#! clerical succession"
  DARK_GOD_TENET_REQUIRES_DARK_SISTERS_TRIGGER:0 "Only a rite of the [GetTenetType('tenet_dark_sisters').GetName( GetPlayer.GetRite )] honours the dark gods: requires the [GetTenetType('tenet_dark_sisters').GetName( GetPlayer.GetRite )] [core_tenet|E]"

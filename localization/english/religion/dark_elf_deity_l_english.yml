l_english:
  ###################
  # Favor tiers
  ###################
  heard_by_melkor:0 "Heard by Melkor"
  heard_by_melkor_desc:1 "Something behind the Divine Spark has turned its attention your way. When He wants something of you, you will simply know."
  sworn_to_melkor:0 "Sworn to Melkor"
  sworn_to_melkor_desc:0 "You have done the First Dark Lord's bidding, and He has not forgotten it."
  anointed_by_melkor:0 "Anointed by Melkor"
  anointed_by_melkor_desc:0 "The Void has marked you as its own. Others feel it before they understand it."
  chosen_of_melkor:0 "Chosen of Melkor"
  chosen_of_melkor_desc:0 "You are His hand in the world. He has a crown that wants finding."

  heard_by_lloth:0 "Heard by Lloth"
  heard_by_lloth_desc:1 "A thread has brushed your cheek. The Spider Queen knows your name now. When She wants something of you, you will simply know."
  sworn_to_lloth:0 "Sworn to Lloth"
  sworn_to_lloth_desc:0 "You have cut or tied a thread at Her bidding. The web remembers."
  anointed_by_lloth:0 "Anointed by Lloth"
  anointed_by_lloth_desc:0 "She holds a thread of yours as surely as you hold threads of others."
  chosen_of_lloth:0 "Chosen of Lloth"
  chosen_of_lloth_desc:0 "You sit near the heart of Her web. Somewhere a golden choker waits for you."

  heard_by_typhos:0 "Heard by Typhos"
  heard_by_typhos_desc:1 "You have dreamed of shedding. The Serpent dreamed it too. When He wants something of you, you will simply know."
  sworn_to_typhos:0 "Sworn to Typhos"
  sworn_to_typhos_desc:0 "You have given the Serpent what He asked. He has begun to change you."
  anointed_by_typhos:0 "Anointed by Typhos"
  anointed_by_typhos_desc:0 "What you were is falling away. What you are becoming is not yet decided."
  chosen_of_typhos:0 "Chosen of Typhos"
  chosen_of_typhos_desc:0 "The Serpent's own. He speaks of a sceptre crowned with a cobra's hood."

  marked_for_blood_rite_modifier:0 "Marked for the Blood Rite"
  marked_for_blood_rite_modifier_desc:0 "This prisoner has been chosen for the Serpent's altar."

  witnessed_blood_rite_opinion:0 "Performed a Blood Rite"

  ###################
  # Blood Rite interactions
  ###################
  mark_for_blood_rite_interaction:0 "Mark for the Blood Rite"
  mark_for_blood_rite_interaction_desc:0 "Set this prisoner aside for the Serpent's altar. Up to three prisoners can be marked. Perform the rite itself with the [GetDecisionWithKey('perform_blood_rite_decision').GetName] [decision|E]."
  unmark_for_blood_rite_interaction:0 "Spare from the Blood Rite"
  unmark_for_blood_rite_interaction_desc:0 "Take this prisoner back off the altar."
  blood_rite_too_many_marked_tt:0 "No more than #V 3#! prisoners can be marked for the Blood Rite"

  ###################
  # Decisions
  ###################
  commune_with_melkor_decision:0 "Commune with Melkor"
  commune_with_melkor_decision_desc:0 "Reach past the Divine Spark into the Void, and speak with the First Dark Lord. He answers those who make themselves worth His attention, and He always wants something in return."
  commune_with_melkor_decision_tooltip:0 "Seek an audience with Melkor"
  commune_with_melkor_decision_confirm:0 "Begin the rite"
  commune_with_melkor_decision_effect:1 "Melkor hears you, and visits you in a dream that night. From then on you will know what He wills of you, and where: His whispers show on the map for you to take up. This rite is performed only once."

  commune_with_lloth_decision:0 "Commune with Lloth"
  commune_with_lloth_decision_desc:0 "Pluck a thread of the great web and wait for the Spider Queen to notice. She always does, eventually, and She keeps a ledger."
  commune_with_lloth_decision_tooltip:0 "Seek an audience with Lloth"
  commune_with_lloth_decision_confirm:0 "Begin the rite"
  commune_with_lloth_decision_effect:1 "Lloth hears you, and visits you in a dream that night. From then on you will know what She wills of you, and where: Her whispers show on the map for you to take up. This rite is performed only once."

  commune_with_typhos_decision:0 "Commune with Typhos"
  commune_with_typhos_decision_desc:0 "Shed what you were, and ask the Serpent what you are to become. His answers arrive slowly, and in the blood."
  commune_with_typhos_decision_tooltip:0 "Seek an audience with Typhos"
  commune_with_typhos_decision_confirm:0 "Begin the rite"
  commune_with_typhos_decision_effect:1 "Typhos hears you, and visits you in a dream that night. From then on you will know what He wills of you, and where: His whispers show on the map for you to take up. This rite is performed only once."

  perform_blood_rite_decision:0 "Perform the Blood Rite"
  perform_blood_rite_decision_desc:0 "Every prisoner marked for the altar dies tonight, and the Serpent reads what was in their blood. Strong blood earns a gift; weak blood may earn a curse.\n\nCurrent blood quality: #V [ROOT.Char.MakeScope.ScriptValue('blood_rite_quality')|0]#!\n#weak Poor 0-4: 40% gift, 20% curse. Fair 5-9: 60% gift, 15% curse. Strong 10-14: 80% gift, 5% curse. Exceptional 15+: a gift, guaranteed.#!\n\nRank, elven blood, purity of blood and congenital gifts all count. Your own kin count most of all."
  perform_blood_rite_decision_tooltip:0 "Sacrifice the marked prisoners to Typhos"
  perform_blood_rite_decision_confirm:0 "Let the blood speak"
  perform_blood_rite_decision_effect:0 "The marked prisoners are sacrificed. Depending on the quality of their blood you may gain or strengthen a congenital [trait|E], or suffer a worse one. Typhos's favor grows, along with your [piety|E] and [dread|E]. Vassals of other [faiths|E] will not like it."
  blood_rite_needs_marked_tt:0 "At least one prisoner must be marked for the Blood Rite"

  ###################
  # Map pin and contracts
  ###################
  deity_task_pin_tt:1 "#bold Divine whispers#!\nOffered here: #V [ProvinceIcon.GetProvince.MakeScope.Var('deity_pin_offers').GetValue|0]#!\nUnder way here: #V [ProvinceIcon.GetProvince.MakeScope.Var('deity_pin_active').GetValue|0]#!\n\nClick to hear what your god wills."
  dark_elf_deity_group:0 "Divine Task"
  deity_reward_favor_tt:0 "Favor with your god"

  deity_task_melkor_break_them_contract:0 "Break Them"
  deity_task_melkor_break_them_desc:0 "Melkor has named [TaskContract.GetTarget.GetTitledFirstName]: they must kneel to you, pay you tribute, or die by your hand."
  deity_task_melkor_break_them_desc_title:0 "The Void demands it"
  deity_task_melkor_break_them_request:0 "Make [TaskContract.GetTarget.GetTitledFirstName] your vassal or tributary, or kill them. Checked every New Year."
  deity_task_melkor_be_feared_contract:0 "Be Feared"
  deity_task_melkor_be_feared_desc:0 "Melkor wants your subjects afraid of you, and wants it to last."
  deity_task_melkor_be_feared_desc_title:0 "The Void demands it"
  deity_task_melkor_be_feared_request:0 "Reach 50 [dread|E] and hold it on two consecutive New Years."
  deity_task_lloth_thread_cut_contract:0 "A Thread Cut"
  deity_task_lloth_thread_cut_desc:0 "Lloth has named a thread to be cut: [TaskContract.GetTarget.GetTitledFirstName] must die by your hand."
  deity_task_lloth_thread_cut_desc_title:0 "The Spider Queen demands it"
  deity_task_lloth_thread_cut_request:0 "Kill [TaskContract.GetTarget.GetTitledFirstName]: a murder [scheme|E], an execution, or any death credited to you."
  deity_task_lloth_thread_tied_contract:0 "A Thread Tied"
  deity_task_lloth_thread_tied_desc:0 "Lloth has named a thread to be tied: gain a hold over [TaskContract.GetTarget.GetTitledFirstName]."
  deity_task_lloth_thread_tied_desc_title:0 "The Spider Queen demands it"
  deity_task_lloth_thread_tied_request:0 "Gain a [hook|E] on [TaskContract.GetTarget.GetTitledFirstName]. Checked every New Year."
  deity_task_typhos_strong_blood_contract:0 "Strong Blood"
  deity_task_typhos_strong_blood_desc:0 "Typhos wants a child of your line born with the Serpent's gifts."
  deity_task_typhos_strong_blood_desc_title:0 "The Serpent demands it"
  deity_task_typhos_strong_blood_request:0 "Sire or bear a child born with a good congenital trait."
  deity_task_typhos_shed_skin_contract:0 "Shed the Skin"
  deity_task_typhos_shed_skin_desc:0 "Typhos wants blood on His altar, and He wants it strong."
  deity_task_typhos_shed_skin_desc_title:0 "The Serpent demands it"
  deity_task_typhos_shed_skin_request:0 "Mark prisoners for the Blood Rite and perform it at fair quality (5) or better."
  task_contract_reward_effect_deity_success_desc:0 "Your god's regard"

  ###################
  # Events: Heard
  ###################
  dark_elf_deity.1001.t:0 "A Voice from Behind the Spark"
  dark_elf_deity.1001.desc:0 "The rite is old and simple: a dark room, an open flame, and the Void named aloud. For a long while nothing answers.\n\nThen the flame leans toward you, though there is no draught, and you understand that you have been heard. Not welcomed. Heard. Whatever waits behind the Divine Spark has turned a fraction of its attention your way, and you have the distinct sense that it is deciding what you are for."
  dark_elf_deity.1001.a:0 "I will make myself worth His attention."

  dark_elf_deity.1002.t:0 "A Thread Across the Cheek"
  dark_elf_deity.1002.desc:0 "You pluck a single thread of the great web, as the Sisters taught, and wait.\n\nSomething brushes your cheek: a strand of silk where there is no silk, gone as soon as you reach for it. Later that evening a courtier you have trusted for years catches your eye across the hall and smiles in a way they never have before, and you realise the Spider Queen has been in this house far longer than you have."
  dark_elf_deity.1002.a:0 "She knows my name. Good."

  dark_elf_deity.1003.t:0 "A Dream of Shedding"
  dark_elf_deity.1003.desc:0 "The rite ends with your own blood on the altar stone, a few drops, and the taste of copper in your mouth.\n\nNothing answers. But as you rise you feel something enormous and patient turn over in its sleep, somewhere far below, and you know that it has smelled you."
  dark_elf_deity.1003.a:0 "Then let it wake."

  ###################
  # Events: the dream
  ###################
  dark_elf_deity.dream.unlock_tt:1 "From now on you will know what this god wills of you, and where. These #bold whispers#! show on the map, up to three at a time, renewed each New Year. Click one to hear the task and take it up."
  dark_elf_deity.1101.t:0 "The Void Comes Calling"
  dark_elf_deity.1101.desc:1 "That night you dream of a hall with no walls and no ceiling, only a floor of black glass going on forever, and on it a throne with nobody in it.\n\n\"You called,\" says the empty throne, in a voice like a door closing. \"So. You will do things for Me, and I will let you become something. I will not send messengers. When I want you somewhere, you will know it, the way you know your own name.\"\n\nYou wake before dawn already knowing, without knowing how, that He wants something of you, and where."
  dark_elf_deity.1101.a:1 "I will listen for Him."

  dark_elf_deity.1102.t:0 "The Spider Queen Comes Calling"
  dark_elf_deity.1102.desc:1 "That night you dream you are lying in a web the size of a kingdom, and every thread of it leads back to a shape you cannot quite look at.\n\n\"You plucked My web,\" says the shape, amused. \"Then learn how it is woven. You will feel which threads want cutting, and which want tying, before I ever say so. Do as I ask, and you will find yourself nearer the centre than you were.\"\n\nYou wake with the ghost of silk across your face, and the first of those threads already humming at the back of your mind."
  dark_elf_deity.1102.a:1 "I will listen for Her."

  dark_elf_deity.1103.t:0 "The Serpent Comes Calling"
  dark_elf_deity.1103.desc:1 "That night you dream you are splitting along the spine. It does not hurt. Something is easing itself out of you, patient and enormous, and when you turn to look at what is left behind it is only skin, thin as paper, in the exact shape of who you used to be.\n\n\"Blood,\" says the thing that came out of you, in your own voice. \"Strong blood, and often. You will not need telling where; it will itch under your skin until you go. Feed Me, and I will finish what I started tonight.\""
  dark_elf_deity.1103.a:1 "I will listen for Him."

  ###################
  # Events: Anointed
  ###################
  dark_elf_deity.1011.t:0 "What Fear Can Buy"
  dark_elf_deity.1011.desc:0 "He shows you a hall full of your own vassals, and in each of their chests a small cold coal of fear with your name on it. He shows you how easily it could be blown into flame.\n\n\"They will never love you,\" says the Void, in a voice like a door closing. \"Stop asking them to.\""
  dark_elf_deity.1011.a:0 "Show me."
  dark_elf_deity.1011.b:0 "I rule my own way."

  dark_elf_deity.1012.t:0 "A Thread of Your Own"
  dark_elf_deity.1012.desc:0 "\"You have cut threads for Me,\" She says, \"and tied them. Now give Me one of yours.\"\n\nShe means a secret. A true one, the kind that could unmake you. She will keep it in the web, She promises, and never touch it, so long as you never give Her cause."
  dark_elf_deity.1012.a:0 "I swear it, and I give it."
  dark_elf_deity.1012.b:0 "My secrets are my own."

  dark_elf_deity.1013.t:0 "The First True Shedding"
  dark_elf_deity.1013.desc:0 "It begins as an itch beneath the skin and ends with you on the floor of your chamber, gasping, while something in you is unmade and remade at once.\n\nWhen it is over you are stronger, or cleverer, or more beautiful than you were. You are also, in some way you cannot yet name, worse. The Serpent does not improve. The Serpent changes."
  dark_elf_deity.1013.a:0 "Let it change me."
  dark_elf_deity.1013.b:0 "Not yet. Not like this."

  ###################
  # Events: Chosen
  ###################
  dark_elf_deity.1021.t:0 "The Hand of the Void"
  dark_elf_deity.1021.desc:0 "\"You are My hand in the world,\" says the Void, and for the first time it sounds almost pleased. \"There is a crown that was taken from Me. Black iron, older than your kind. When the time comes, you will bring it to Me.\"\n\n#weak (The hunt for the Black Crown arrives in a later version of the mod.)#!"
  dark_elf_deity.1021.a:0 "When the time comes."

  dark_elf_deity.1022.t:0 "Near the Heart of the Web"
  dark_elf_deity.1022.desc:0 "\"Weave for Me,\" She says, and it is not a request. \"There is a choker of gold, spun in the shape of My daughters, hidden where only you could find it. When the time comes, you will.\"\n\n#weak (The hunt for the Golden Spider Choker arrives in a later version of the mod.)#!"
  dark_elf_deity.1022.a:0 "When the time comes."

  dark_elf_deity.1023.t:0 "The Serpent's Own"
  dark_elf_deity.1023.desc:0 "\"What you were is gone,\" says the Serpent, and it is true. \"There is a sceptre, hooded like a cobra, that I gave to the first of My faithful. When the time comes, you will bring it to Me.\"\n\n#weak (The hunt for the Cobra Sceptre arrives in a later version of the mod.)#!"
  dark_elf_deity.1023.a:0 "When the time comes."

  ###################
  # Events: task completed / failed
  ###################
  dark_elf_deity.3001.t:0 "The God Is Pleased"
  dark_elf_deity.3001.melkor:0 "It is done, and the Void knows it before you do. The flame in your chamber burns a shade darker for a night, which is as close to praise as Melkor comes."
  dark_elf_deity.3001.lloth:0 "It is done. Somewhere in the web a thread goes taut, and you feel Her attention settle on you like a hand on the shoulder. Approving. Proprietary."
  dark_elf_deity.3001.typhos:0 "It is done, and the Serpent tastes it in your blood. Something in you loosens, the way old skin loosens before it goes."
  dark_elf_deity.3001.a:0 "I am worth His attention."

  dark_elf_deity.3002.t:0 "The God Is Not Pleased"
  dark_elf_deity.3002.melkor:0 "The time He gave you has run out, or the thing He asked for can no longer be done. The Void does not rage. It simply withdraws a little further, and the room is colder for it."
  dark_elf_deity.3002.lloth:0 "The thread She named is beyond your reach now. She says nothing at all, which from the Spider Queen is worse than anything She could say."
  dark_elf_deity.3002.typhos:0 "The blood He asked for was never spilled. The Serpent turns over in its long sleep and, for now, forgets your name."
  dark_elf_deity.3002.a:0 "I will do better."

  ###################
  # Events: Blood Rite outcome
  ###################
  dark_elf_deity.4001.t:0 "What Was in the Blood"
  dark_elf_deity.4001.good:0 "The altar runs red, and the Serpent drinks. Something passes from the dead into you: a strength, a sharpness, a grace that was not yours an hour ago. The blood was good."
  dark_elf_deity.4001.none:0 "The altar runs red, and the Serpent drinks, and gives nothing back. The blood was thin. He is not displeased, exactly; He is simply still hungry."
  dark_elf_deity.4001.bad:0 "The altar runs red, and the Serpent drinks, and what it gives back is not a gift. Weak blood carries weak things, and one of them has found its way into you."
  dark_elf_deity.4001.a:0 "The Serpent changes."

  ###################
  # Events: a whisper on the map was clicked
  ###################
  dark_elf_deity.5001.t:1 "Whispers at [pin_province.GetName]"
  dark_elf_deity.5001.desc:1 "No voice speaks, and none needs to. You simply know what your god wills of you here.\n\n"
  dark_elf_deity.5001.offer_melkor_break_them:0 "#bold Break Them:#! [pin_province.MakeScope.Var('deity_offer_melkor_break_them_target').Char.GetTitledFirstName] must kneel to you, pay you tribute, or die by your hand.\n"
  dark_elf_deity.5001.offer_melkor_be_feared:0 "#bold Be Feared:#! reach 50 [dread|E] and hold it for a full year.\n"
  dark_elf_deity.5001.offer_lloth_thread_cut:0 "#bold A Thread Cut:#! [pin_province.MakeScope.Var('deity_offer_lloth_thread_cut_target').Char.GetTitledFirstName] must die by your hand.\n"
  dark_elf_deity.5001.offer_lloth_thread_tied:0 "#bold A Thread Tied:#! gain a [hook|E] on [pin_province.MakeScope.Var('deity_offer_lloth_thread_tied_target').Char.GetTitledFirstName].\n"
  dark_elf_deity.5001.offer_typhos_strong_blood:0 "#bold Strong Blood:#! sire or bear a child born with a good congenital trait.\n"
  dark_elf_deity.5001.offer_typhos_shed_skin:0 "#bold Shed the Skin:#! perform a Blood Rite of fair quality or better.\n"
  dark_elf_deity.5001.active:0 "\n#weak Tasks already under way here: [pin_province.MakeScope.Var('deity_pin_active').GetValue|0]. Find them in your contracts.#!"
  dark_elf_deity.5001.no_offers:0 "\nNothing more is asked of you here for now."
  dark_elf_deity.5001.melkor_break_them:0 "Break [pin_province.MakeScope.Var('deity_offer_melkor_break_them_target').Char.GetTitledFirstName]."
  dark_elf_deity.5001.melkor_be_feared:0 "Be feared."
  dark_elf_deity.5001.lloth_thread_cut:0 "Cut the thread: [pin_province.MakeScope.Var('deity_offer_lloth_thread_cut_target').Char.GetTitledFirstName] dies."
  dark_elf_deity.5001.lloth_thread_tied:0 "Tie the thread: a hook on [pin_province.MakeScope.Var('deity_offer_lloth_thread_tied_target').Char.GetTitledFirstName]."
  dark_elf_deity.5001.typhos_strong_blood:0 "Strong blood."
  dark_elf_deity.5001.typhos_shed_skin:0 "Shed the skin."
  dark_elf_deity.5001.leave:0 "Not now."

  # Option tooltips: what each task asks, how it is judged, and what it pays (the piety and favor grow with the star tier)
  dark_elf_deity.task.melkor_break_them_tt:1 "#bold Break Them#!\nThe named ruler must #V kneel to you#! (become your vassal), #V pay you tribute#!, or #V die by your hand#!. Any death the game credits to you counts: a murder scheme, an execution, a duel.\nThe task is checked every New Year.\n\nDeadline: at least #V 10 years#!.\nReward: at least #P +25 favor#! with Melkor and a major sum of [piety|E].\nFailure, a target lost to someone else, or abandonment: #N -15 favor#!."
  dark_elf_deity.task.melkor_be_feared_tt:0 "#bold Be Feared#!\nRaise your [dread|E] to #V 50#! or more and keep it there for a full year: you must be at #V 50+#! on two consecutive New Years.\n\nDeadline: #V 5 years#!.\nReward: #P +15 favor#! with Melkor and a major sum of [piety|E].\nFailure or abandonment: #N -15 favor#!."
  dark_elf_deity.task.lloth_thread_cut_tt:1 "#bold A Thread Cut#!\nThe named character must #V die by your hand#!: a successful murder [scheme|E], an execution from your dungeon, or any other death the game credits to you. A death you had no part in fails the task.\n\nDeadline: at least #V 10 years#!.\nReward: at least #P +20 favor#! with Lloth and a major sum of [piety|E].\nFailure or abandonment: #N -15 favor#!."
  dark_elf_deity.task.lloth_thread_tied_tt:1 "#bold A Thread Tied#!\nGain a [hook|E] on the named character: uncover a [secret|E] and blackmail them, or earn a favor through interactions and schemes. Any hook counts.\nThe task is checked every New Year.\n\nDeadline: at least #V 5 years#!.\nReward: at least #P +15 favor#! with Lloth and a major sum of [piety|E].\nFailure or abandonment: #N -15 favor#!."
  dark_elf_deity.task.typhos_strong_blood_tt:0 "#bold Strong Blood#!\nSire or bear a child who is born with a #V good congenital trait#! (Strong, Intelligent or Beautiful, at any level) from this day on. Divine Marriage and the Serpent's own blessings improve the odds.\n\nDeadline: #V 10 years#!.\nReward: #P +25 favor#! with Typhos and a major sum of [piety|E].\nFailure or abandonment: #N -15 favor#!."
  dark_elf_deity.task.typhos_shed_skin_tt:0 "#bold Shed the Skin#!\nPerform a #V Blood Rite#! of #V fair quality (5) or better#!: imprison worthy victims, use #V Mark for the Blood Rite#! on up to three of them, then take the [GetDecisionWithKey('perform_blood_rite_decision').GetName] [decision|E]. Rank, elven and pure blood, and congenital gifts all raise the quality; your own kin most of all.\n\nDeadline: #V 10 years#!.\nReward: #P +15 favor#! with Typhos and a major sum of [piety|E], on top of what the rite itself grants.\nFailure or abandonment: #N -15 favor#!."

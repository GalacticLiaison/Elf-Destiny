l_english:

 ### Lormelis Elves ###
 lormelis_tideborn_raiders:0 "Tideborn Raiders"
 lormelis_tideborn_raiders_flavor:0 "#F Trained in coastal ambush and naval boarding actions, the Tideborn Raiders strike from sea and shore alike, stealing supplies and striking terror into the hearts of landlocked armies."

 lormelis_atlantean_leviathans:0 "Leviathans"
 lormelis_atlantean_leviathans_flavor:0 "#F Swift heavy infantry trained in the ways of the Lormelis. Their discipline and resilience make them as deadly as an Ocean Storm."

 ### Daelurin Elves ###
 daelurin_whitevale_warriors:0 "Daelurin Whitevale Warriors"
 daelurin_whitevale_warriors_flavor:0 "#F Towering elites born of shadowed mountains and ancient rituals. Their discipline and strength make them a terror on any battlefield."

 daelurin_wolf_riders:0 "Daelurin Wolf Riders"
 daelurin_wolf_riders_flavor:0 "#F Savage cavalry mounted on war-wolves, capable of navigating even the harshest terrain with speed and brutality."

 daelurin_highlanders:0 "Highlanders"
 daelurin_highlanders_flavor:0 "#F Hardened skirmishers from the highlands, these fighters wield immense axes and unshakable loyalty to their kin."

 ### Gwynthorn Elves ###
 gwynthorn_axeguard:0 "Gwynthorn Axeguard"
 gwynthorn_axeguard_flavor:0 "#F Elite forest-bound heavy infantry trained in the ancient traditions of the Gwynthorn. Their discipline and resilience make them deadly in rough terrain."

 gwynthorn_horse_archers:0 "Gwynthorn Horse Archers"
 gwynthorn_horse_archers_flavor:0 "#F Swift and precise, these mounted archers combine elven agility with mobile tactics, harassing enemies from afar before vanishing into the woods."

 gwynthorn_noble_protectors:0 "Noble Infantry"
 gwynthorn_noble_protectors_flavor:0 "#F Heavily armored pikemen drawn from Gwynthorn noble lines, these warriors specialize in holding ground and countering cavalry charges with unwavering resolve."

 ### Valerith Elves ###
 valerith_rangers:0 "Rangers"
 valerith_rangers_flavor:0 "#F Silent and deadly, the Valerith Rangers are masters of forest warfare. With unmatched marksmanship and keen instincts, they rain death from the shadows before vanishing into the trees."

 valerith_shining_clerics:0 "Shining Clerics"
 valerith_shining_clerics_flavor:0 "#F Mystic warriors devoted to the spark, the Shining Clerics wield sacred power to shield allies and disorient foes. Their mere presence on the battlefield inspires awe and dread."

 valerith_gendarmes:0 "Valerith Gendarmes"
 valerith_gendarmes_flavor:0 "#F The shining elite of Valerith chivalry, these heavily armored cavalry strike with refined precision. Proud, swift, and utterly lethal in open terrain, they embody the martial nobility of their house."

 ### Thundarael Elves ###
 thundarael_moon_knights:0 "Moon Knights"
 thundarael_moon_knights_flavor:0 "#F Clad in shimmering silver armor, the Moon Knights of Thundarael are elite heavy infantry who draw strength from the night and the highlands. They are unyielding in battle and revered in legend."

 thundarael_winged_warriors:0 "Winged Warriors"
 thundarael_winged_warriors_flavor:0 "#F Fast-moving skirmishers with the agility of birds and the precision of hawks. The Winged Warriors strike quickly and vanish into the terrain, especially adept in forests and hills."

 ### Serelion Elves ###
 serelion_longbow_knights:0 "Serelion Longbow Knights"
 serelion_longbow_knights_flavor:0 "#F Renowned for their precision and agility, the Serelion Longbow Knights are expert archers trained in forest and hill warfare. Their long-range volleys strike with deadly accuracy."

 serelion_swordsmasters:0 "Serelion Swordsmasters"
 serelion_swordsmasters_flavor:0 "#F These elite swordsmen embody the martial traditions of Serelion nobility. Their prowess in melee combat is unmatched, making them formidable on open and rough terrain alike."

 serelion_paladins:0 "Serelion Paladins"
 serelion_paladins_flavor:0 "#F Noble riders armored in polished steel, the Serelion Paladins deliver decisive charges that scatter enemy lines. Their training makes them especially effective in open terrain."

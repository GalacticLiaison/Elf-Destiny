 tradition_the_old_ways_dark_name:0 "The Old Ways"
 tradition_the_old_ways_dark_desc:0 "This culture is ancient and shadowed, looking to the past for guidance. It knows that there is power to be found there, and that the old ways are often the best ways."
 
 culture_parameter_dark_elf_tattooing_common:0 "Characters will often choose to tattoo themselves"
 tradition_the_black_crown_name:0 "The Black Crown"
 tradition_the_black_crown_desc:0 "In the far north, rule is not loved. It is endured. Every lord of this culture wears the black crown in spirit if not in iron, a mantle of quiet fear that settles over hall and holdfast alike and does not thaw."

 tradition_night_mothers_name:0 "Night Mothers"
 tradition_night_mothers_desc:0 "Rule in this culture passes from mother to daughter, as it always has. Its matriarchs govern from behind the veil of night. Their words are soft, their reach is long, and their sons learn early whom they serve."


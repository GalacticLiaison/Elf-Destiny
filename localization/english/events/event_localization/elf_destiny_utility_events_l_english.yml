  elf_destiny_utility.03.title:0 "The Call of the Wandering"
  elf_destiny_utility.03.desc:0 "You stand alone looking deep into the whispering forest. The evening wind carries scents of pine, moss, and distant rain. For an age you have ruled, guided your kin, and watched generations rise and fall around you. Yet tonight, something feels different.\nA deep, wordless longing stirs within your soul — an ancient instinct that has awakened with the weight of your many years. The halls, the weight of the crown, the endless duties of this Lordship… they suddenly feel heavy. The wilds beyond the kingdom call to you with a quiet but insistent voice. To walk beneath untouched canopies, to seek what lies beyond the horizon, or perhaps even to step through the Grand Portal into unknown realms.\nThe urge is not born of despair or weariness, but of something far older and more primal, the natural cycle of elvenkind. Deep down, you understand that this is The Wandering — the instinct that eventually claims all elves who live long enough.\nWhat will you do?"

  elf_destiny_utility.03.go:0 "I will embrace The Wandering. My time to depart has come."
  elf_destiny_utility.03.stay:0 "Not yet. I still have duties to fulfill."

  elf_destiny_utility.0301.title:0 "Farewell to the Realm"
  elf_destiny_utility.0301.desc:0 "The decision is made. A profound sense of peace settles over you as the ancient instinct fully awakens. You gather your closest family and trusted advisors in the great hall one final time. There are no tears — only quiet understanding. For elves, The Wandering is not death, but the next step in a long and sacred cycle. You speak softly to your kin, sharing final words of wisdom, love, and guidance. To your heir, you pass the crown with steady hands, entrusting them with the future of the realm. \"My time among these halls has ended,\" you tell them. \"Rule wisely\"\nThat same night, under a sky thick with stars, you leave the palace alone. No grand procession follows. You simply walk into the shadowed forest, the weight of rulership slipping from your shoulders with every step. Behind you, the lights of the elven capital grow distant. Ahead lies the unknown — the wild untouched lands, or perhaps the shimmering promise of the Grand Portal. As the trees close around you, a deep serenity fills your spirit. To the world you leave behind, you are already gone. #bold The Wandering has claimed you.#!"
  elf_destiny_utility.0301.a:0 "I think I’m quite ready for another adventure"
  
  elf_destiny_utility.031.title:0 "The Call of The Wandering"
  elf_destiny_utility.031.desc:0 "You find [family_member.GetName] standing alone, gazing silently into the ancient forest that borders your realm.\n\nWhen [family_member.GetSheHe] notices you, [family_member.GetSheHe] turns with a calm but distant expression. \"The longing has come,\" [family_member.GetSheHe] says softly. \"I have lived a great while, and now the wilds call to me. It is the old instinct — The Wandering — that stirs in every elf who lingers too long in one place.\"\n\n[family_member.GetSheHe|U] speaks without sorrow, only quiet acceptance. Part of you knew this day might come. Now the choice falls to you as ruler and kin: will you try to convince [family_member.GetHerHim] to stay, or honor the natural cycle and let [family_member.GetHerHim] go?"

  elf_destiny_utility.031.a:0 "Try to convince [family_member.GetHerHim] to stay"
  elf_destiny_utility.031.b:0 "Accept their departure and bid them farewell"
  elf_destiny_utility.031.a.success:0 "[family_member.GetFirstNameNoTooltip] is convinced"
  elf_destiny_utility.031.a.failure:0 "[family_member.GetFirstNameNoTooltip] remains resolute"
  elf_destiny_utility.031.a.success_tooltip:0 "[family_member.GetFirstName] will remain"
  elf_destiny_utility.031.a.failure_tooltip:0 "[family_member.GetFirstName] will wander"

  elf_destiny_utility.0311.title: "[family_member.GetFirstName] Agrees to Stay"
  elf_destiny_utility.0311.desc: "You speak earnestly with [family_member.GetName], reminding [family_member.GetHerHim] of [family_member.GetHerHis] duties to the family and the realm. You appeal to [family_member.GetHerHis] sense of loyalty and the years you have shared together.\n\nAfter a long silence, [family_member.GetSheHe] sighs softly and nods. \"Very well. For you, and for our bloodline, I will resist the call a while longer. But I cannot promise it will not return one day. The instinct grows stronger with every passing decade.\"\n\n[family_member.GetSheHe|U] remains, though you can see in [family_member.GetHerHis] eyes that part of [family_member.GetHerHim] already yearns for the wilds beyond the kingdom."
  elf_destiny_utility.0311.a:0 "Thank you old friend"

  elf_destiny_utility.0312.title: "[family_member.GetFirstName] Chooses The Wandering"
  elf_destiny_utility.0312.desc: "You plead with [family_member.GetName], asking [family_member.GetHerHim] to stay for the sake of the family and the realm. You speak of unfinished duties, of the love shared between kin, and of the stability [family_member.GetSheHe] brings to the court.\n[family_member.GetSheHe|U] listens patiently, [family_member.GetHerHis] expression gentle but resolute. When you finish, [family_member.GetSheHe] offers a warm, sad smile.\n\"I have loved this life and our family more than words can express,\" [family_member.GetSheHe] says softly. \"But the call of The Wandering is not born of discontent. It is the natural rhythm of our kind. To resist it forever would be to deny what we are.\"\n[family_member.GetSheHe|U] steps forward and embraces you one last time. \"Rule wisely, and know that I depart with peace in my heart. May our bloodline flourish long after I have gone.\"\nThat night, [family_member.GetFirstName] leaves quietly, walking alone into the shadowed forest. To the realm, [family_member.GetSheHe] is now counted among the departed."
  elf_destiny_utility.0312.a:0 "Goodbye old friend"

  wander_sickness_inner_struggle:0 "[wander_resister.GetFirstName] faces an inner struggle"
  elf_destiny_utility.032.title: "A Struggle of Self"
  elf_destiny_utility.032.desc: "The call has returned stronger than ever before. For the fourth time you attempt to silence the ancient instinct within your soul. As you sit alone in quiet meditation, a fierce internal battle erupts.\n\nVisions flood your mind — endless untouched forests, shimmering portals to distant realms, and the peaceful release of finally letting go. Your sense of duty and love for your realm clash violently against this primal elven urge. The pain is not physical, but spiritual, tearing at the very core of your being.\n\nHours pass. Days blur. You fight with every fragment of will you possess."
  elf_destiny_utility.032.a: "I... must..."
  elf_destiny_utility.032.a.success: "You overcome your struggle"
  elf_destiny_utility.032.a.success_tooltip: "[wander_resister.GetFirstNameNoTooltip] achieves inner peace"
  elf_destiny_utility.032.a.failure: "You cannot resolve this struggle"
  # elf_destiny_utility.032.a.failure_tooltip: ""

  elf_destiny_utility.0321.title: "You Transcend the Cycle"
  elf_destiny_utility.0321.desc: "With a final, mighty effort of will and spirit, you master the ancient call. The raging storm inside you suddenly falls silent. A profound tranquility washes over your soul. You have not defeated The Wandering — you have risen above it.\n\nYou emerge changed, at perfect peace with both your elven nature and your chosen path as ruler. The wilds no longer pull at you. You are free."
  elf_destiny_utility.0321.a: "Im at peace"

  elf_destiny_utility.0322.title: "The Call Overwhelms"
  elf_destiny_utility.0322.desc: "Try as you might, the instinct proves too powerful. The visions and longing crash over you like an unstoppable tide. You collapse, gasping, as wave after wave of spiritual agony tears through your mind. Though you still cling to the realm, the defeat leaves deep scars upon your soul."
  elf_destiny_utility.0322.a: "I am lost"

  death_wandering:0 "Taken to Wandering"
  death_wandering_portal:0 "Left through the Grand Portal to Wander distant realms"

  wander_sick_1:0 "Restless Spirit"
  wander_sick_1_desc:0 "A quiet unease has settled in their soul. The ancient call of The Wandering stirs faintly, making long stays in one place feel slightly oppressive. Though still manageable, they find themself gazing toward the wilds more often."
  wander_sick_2:0 "Wandering Malady"
  wander_sick_2_desc:0 "The call of The Wandering has grown insistent within their heart. They feel a deepening restlessness and melancholy, as though the very halls and forests of the realm are slowly closing in. Focus wanes and they yearn for paths untrodden."
  wander_sick_3:0 "The Unyielding Longing"
  wander_sick_3_desc:0 "They are consumed by The Wandering’s unrelenting call. A profound spiritual sickness grips their being — every moment spent within the confines of civilization brings sharp sorrow and detachment from the world. Only by answering the call can they find peace once more."

  wander_immune: "The Uncalled"
  wander_immune_desc: "After countless struggles against the ancient call, they have achieved a rare inner harmony. The instinct of The Wandering no longer troubles them. They walk the world with a tranquil spirit, fully at peace with both realm and wilds, having transcended the cycle that claims most elder elves."

  departed_for_wandering:0 "[wanderer.GetFirstName] leaves the realms to Wander"
  departed_for_wandering_desc:0 "[wanderer.GetFirstName] has felt the call that comes to most elves in time, and has left to wander the realms."
  # departed_for_wandering_desc:0 "[wanderer.GetFirstName] has left the realm to begin The Wandering"
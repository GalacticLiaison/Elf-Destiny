l_english:
  # Title names for the dark elf realms (PM 2026-09-02). Set at game start with
  # set_title_name in dark_elf_realm_titles_effect
  # (common/scripted_effects/elf_dest_title_effects.txt); the name stays with the
  # title whoever holds it later. (The <title>_<culture> loc-only pattern does NOT
  # work in CK3 - verified in-game.)

  # Malric's kingdom in the north
  cn_svartalfaheim:0 "Svartalfaheim"
  cn_svartalfaheim_adj:0 "Svartalfar"

  # Triel's web in Guinea
  cn_menzoberranzan:0 "Menzoberranzan"
  cn_menzoberranzan_adj:0 "Menzoberranyr"

  # Zynvara's serpent kingdom (Valusia and Kamula are R.E. Howard Thurian Age
  # names; Kamula also echoes the vanilla Kamarupa)
  cn_valusia:0 "Valusia"
  cn_valusia_adj:0 "Valusian"
  cn_kamula:0 "Kamula"
  cn_kamula_adj:0 "Kamulan"

  # Hrafnvir's Rynvela seat (c_sudurland), home of Hekla's Black Palace. Norse
  # "corpse-shore" of the dead - fitting for the necromancer house and the
  # medieval legend of Mount Hekla as a gateway to the underworld.
  cn_nastrond:0 "Náströnd"
  cn_nastrond_adj:0 "Náströnd"

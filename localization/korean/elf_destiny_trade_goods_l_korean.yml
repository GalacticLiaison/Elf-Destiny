 expedition_unique_encounters.0041.title: "The Sealed Bakery"
 expedition_unique_encounters.0041.desc: "Behind a collapsed archway we find a hall of cold stone ovens, each large enough to stand in. This was no village bakehouse. Whoever worked here fed armies.\n\nIn the master baker's cell stands a chest of black oak bound in bronze, its lock still sound after all these centuries. It takes the better part of a day to open. Inside, wrapped in waxed leaves, lies a single book.\n\nThe hand is neat and patient: measures of meal and honey, the hour of the harvest, the folding of the leaves. It is the recipe for #high lembas#!, the waybread of our ancestors."
 expedition_unique_encounters.0041.a: "I will learn every page of it myself."
 expedition_unique_encounters.0041.b: "Let every baker in the realm have a copy."
 expedition_unique_encounters.0042.title: "The Smith at the Anvil"
 expedition_unique_encounters.0042.desc: "The lower halls open into a forge the size of a temple. The great bellows have rotted away, but the anvil stands, and at the anvil sits its master: bones in a leather apron, a hammer still in the hand.\n\nOn the bench before the smith lies a shirt of mail, half finished, bright as the day it was drawn. It weighs no more than linen. Beside it is a ledger of working notes, heats and quenches set down in a cramped and careful script.\n\nNo one living remembers how to work #high mythril#!. These pages do."
 expedition_unique_encounters.0042.a: "I will read them until I understand the craft."
 expedition_unique_encounters.0042.b: "Bring the notes home. Our smiths have work to do."
 divine_spark_rituals.002.mythril: "Show me what lies beneath my lands."
 divine_spark_rituals.002.mythril.tt: "The Divine Spark reveals a #high Mythril Vein#! in one of your holdings, most likely in mountains or hills."
 divine_spark_rituals.0021.title: "A Blessing of Wealth"
 divine_spark_rituals.0021.desc: "A great bright beam of Spark descends from the sky upon #high [mythril_vein_barony.GetNameNoTier]#!, in the [mythril_vein_county.GetName]. It is an astonishing spectacle that can be seen for many miles. The light vanishes as suddenly as it appeared, and at first the locals notice nothing amiss.\n\nIt is not long, however, before word reaches my court: a vein of the legendary metal mythril has been found there.\n\nThe Divine Spark has blessed my lands with great riches indeed."
 divine_spark_rituals.0021.a: "And they call it a mine. A mine!"
 divine_spark_rituals.0021.a.tt: "A #high Mythril Vein#! has been revealed in [mythril_vein_barony.GetNameNoTier] ([mythril_vein_county.GetName]). A [GetBuildingType('mythril_mine_01').GetName] can be built there once your [culture|E] knows #high Mythril Working#!."
 innovation_mythril_working_expedition_only: "Can only be recovered on an Expedition"
 elf_dest_mythril_working_discovered.t: "Mythril Working"
 elf_dest_mythril_working_discovered.desc: "Among the finds of the expedition are the notes of a master smith. Your [culture|E] has recovered the art of Mythril Working."
